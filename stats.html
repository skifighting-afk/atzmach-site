<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>방문 통계 · ATZ MACH</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#070620;--pn:#100d33;--ln:rgba(255,255,255,.1);--fg:#f3efff;--dim:#b4afdf;--br:#ff5ccf;--br2:#7a6bff;--gain:#2ee59d;--loss:#ff5c7a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "IBM Plex Sans KR",sans-serif;padding:0 16px 48px}
.w{max-width:1100px;margin:0 auto}header{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--ln);gap:12px;flex-wrap:wrap}
header a{color:var(--dim);font-size:14px;margin-left:12px}.logo{font:800 17px "IBM Plex Mono",monospace;color:var(--fg)!important;margin:0!important;text-decoration:none}.logo b{color:var(--br)}
h1{font-size:24px;margin:24px 0 4px}.sub{color:var(--dim);margin:0 0 20px;font-size:13px}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.k div{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:14px}.k b{display:block;font-size:28px;font-variant-numeric:tabular-nums}.k small{color:var(--dim)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.c{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:16px;min-width:0}
.c h2{font-size:15px;margin:0 0 12px}.bar{display:grid;grid-template-columns:140px 1fr 56px;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.bar i{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--br),var(--br2));display:block;min-width:2px}.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--dim);font-weight:600;font-size:12.5px}td.n{text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--dim);font-size:12.5px;margin-top:8px}.gate{padding:80px 0;text-align:center;color:var(--dim)}
@media(max-width:760px){.k{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.bar{grid-template-columns:100px 1fr 44px}}
</style></head><body><div class="w">
<header><a class="logo" href="index.html">ATZ <b>MACH</b> · 통계</a><nav><a href="admin.html">견적 검토</a><a href="index.html">홈</a></nav></header>
<div id="app"><p class="gate">불러오는 중…</p></div></div>
<script>
"use strict";
const $=s=>document.querySelector(s),esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STEP={free:"1. 업무 설명",sug:"2. 추천 기능",design:"3. 디자인",contact:"4. 연락처",gen:"5. 생성",result:"6. 결과 확인"};
const CTA={hero_click:"히어로 버튼",hero_diagnosis_click:"상단·하단 바 버튼",build_cta:"비용 섹션 버튼",final_cta_click:"마지막 섹션 버튼",demo_cta:"데모 버튼",faq_more:"FAQ 더 보기",custom_inquiry_complete:"상담 신청 완료",aw3_draft:"1차 시안 요청"};
function bars(rows,max){max=max||Math.max(1,...rows.map(r=>r[1]));return rows.map(r=>`<div class="bar"><span title="${esc(r[0])}">${esc(r[0])}</span><i style="width:${Math.max(1,r[1]/max*100)}%"></i><span>${r[1]}${r[2]||""}</span></div>`).join("")||'<p class="note">아직 데이터가 없습니다.</p>'}
function render(D){const n=D.length,sum=k=>D.filter(d=>d.ev&&d.ev[k]).length;
 const leads=D.filter(d=>d.ev&&(d.ev.custom_inquiry_complete||d.ev.aw3_draft||d.steps&&d.steps.result)).length;
 const sc=[25,50,75,100].map(p=>[p+"% 이상",D.filter(d=>(d.scroll||0)>=p).length]);
 const st=Object.keys(STEP).map(k=>[STEP[k],D.filter(d=>d.steps&&d.steps[k]).length]);
 const cta=Object.keys(CTA).map(k=>[CTA[k],sum(k)]);
 const src={};D.forEach(d=>{const k=(d.utm&&d.utm.utm_source)||d.ref||"direct";src[k]=(src[k]||0)+1});
 const ab=["A","B"].map(v=>{const g=D.filter(d=>d.ab===v),c=g.filter(d=>d.ev&&d.ev.hero_click).length,l=g.filter(d=>d.ev&&(d.ev.custom_inquiry_complete||d.steps&&d.steps.result)).length;return{v,n:g.length,c,l}});
 const ev={};D.forEach(d=>{for(const k in d.ev||{})ev[k]=(ev[k]||0)+d.ev[k]});
 $("#app").innerHTML=`<h1>방문 통계</h1><p class="sub">로그인한 방문자 기준 · 방문자 1명당 1건 · 공개 링크로 들어온 비로그인 방문은 집계되지 않습니다.</p>
 <div class="k"><div><small>방문자</small><b>${n}</b></div><div><small>시안 · 상담까지 간 사람</small><b>${leads}</b></div><div><small>전환율</small><b>${n?(leads/n*100).toFixed(1):0}%</b></div><div><small>끝까지 스크롤</small><b>${n?Math.round(sc[3][1]/n*100):0}%</b></div></div>
 <div class="g2"><section class="c"><h2>시안 받기 단계별 도달 (이탈 지점)</h2>${bars(st,n)}<p class="note">줄어드는 폭이 큰 단계가 이탈이 많은 곳입니다.</p></section>
 <section class="c"><h2>스크롤 깊이</h2>${bars(sc,n)}</section>
 <section class="c"><h2>버튼별 누른 사람 수</h2>${bars(cta.sort((a,b)=>b[1]-a[1]))}</section>
 <section class="c"><h2>유입 경로</h2>${bars(Object.entries(src).sort((a,b)=>b[1]-a[1]).slice(0,10))}</section>
 <section class="c"><h2>히어로 문구 A/B</h2><table><thead><tr><th>안</th><th>문구</th><th class="n">방문</th><th class="n">버튼 클릭</th><th class="n">시안·상담</th></tr></thead><tbody>${ab.map(r=>`<tr><td>${r.v}</td><td>${r.v==="A"?"엑셀·카톡으로 버티던 운영…":"말로 설명하면, 1시간 뒤…"}</td><td class="n">${r.n}</td><td class="n">${r.n?(r.c/r.n*100).toFixed(1):0}%</td><td class="n">${r.n?(r.l/r.n*100).toFixed(1):0}%</td></tr>`).join("")}</tbody></table><p class="note">각 안 100명 이상 모인 뒤 판단하세요.</p></section>
 <section class="c"><h2>전체 이벤트 상위 15</h2>${bars(Object.entries(ev).sort((a,b)=>b[1]-a[1]).slice(0,15))}</section></div>`}
(async()=>{const c=window.claude;const[db,u]=c?await Promise.all([c.use("db").catch(()=>null),c.use("user").catch(()=>null)]):[null,null];
 if(!db||!u){$("#app").innerHTML='<p class="gate">로그인한 관리자만 볼 수 있습니다.</p>';return}
 const ok=await u.isOwner().catch(()=>false)||await u.canEdit().catch(()=>false);if(!ok){$("#app").innerHTML='<p class="gate">운영자만 볼 수 있습니다.</p>';return}
 db.collection("stats").limit(2000).onSnapshot(s=>render(s.docs.map(x=>x.data()||{})),()=>{$("#app").innerHTML='<p class="gate">통계를 열 권한이 없습니다.</p>'})})();
</script><style id="qa52-stats-css">.qa52-sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}</style><script id="qa52-stats-js">(function(){var T=document.title.split(' · ')[0];
function fix(){var a=document.getElementById('app');
 if(a){if(a.querySelector('main'))a.removeAttribute('role');else if(!document.querySelector('main'))a.setAttribute('role','main')}
 var h=document.getElementById('qa52-h1'),other=[].some.call(document.querySelectorAll('h1'),function(x){return x!==h});
 if(other&&h)h.remove();else if(!other&&!h){h=document.createElement('h1');h.id='qa52-h1';h.className='qa52-sr';h.textContent=T;
  var m=document.querySelector('main')||a||document.body;m.insertBefore(h,m.firstChild)}}
fix();new MutationObserver(fix).observe(document.body,{childList:true,subtree:true})})();</script></body></html>
