h:`<header class="nv"><div class="w"><a class="lg O" href="#top"><i></i>하이픽</a><nav aria-label="주요 메뉴"><a href="#shelf">매장 구성</a><a href="#why">무인 운영</a><a href="#sim">손익 계산</a><a href="#cost">창업 비용</a><a href="#area">지역 확인</a><a href="#step">절차</a><a href="#faq">FAQ</a></nav><a class="cta" href="#form">창업 상담</a><button class="bq" aria-expanded="false">메뉴</button></div></header>
<section class="hr" id="top"><div class="w"><div><span class="chip"><i></i>아이스크림·간식 무인매장 가맹점 모집</span><h1 class="O">매장에 없어도<br>매장이 보이는 <em>하루 30분</em> 운영</h1><p>결제는 키오스크가, 출입은 인증 단말이, 감시는 CCTV 알림이 맡습니다. 점주는 하루 한 번 들러 진열과 청소를 하고, 나머지는 휴대폰으로 확인합니다.</p><div class="bt"><a href="#sim">관리 시간 대비 손익 보기</a><a href="#form">창업 상담 신청</a></div></div>
<div class="hv"><img data-im="frUnmanned:0" alt="밤에 불이 켜진 무인 간식 매장 내부"><div class="ph" aria-label="점주 앱 화면 예시"><small>점주 앱 · 오늘(예시 화면)</small><div class="big">₩412,600</div><ul><li><span>결제</span><b>97건</b></li><li><span>재고 부족</span><b>3품목</b></li><li><span>냉동고 온도</span><b>−20℃ 정상</b></li></ul><div class="al">22:14 출입 인증 없이 문 열림 감지</div></div></div></div></section>

<section class="sec" id="shelf"><div class="w"><h2 class="h2 O">12평 매장, 이렇게 채웁니다</h2><p class="ld">구역을 누르면 진열 품목과 관리 포인트가 나옵니다. 상품 구성은 본사 표준 진열도(플래노그램)를 따르며, 상권에 따라 비율을 조정합니다.</p>
<div class="map"><div class="pl" role="group" aria-label="매장 구역"><button class="z1" data-z="0" aria-pressed="true">아이스크림 냉동고<small>6대 · 벽면</small></button><button class="z2" data-z="1">과자·스낵<small>곤돌라 2열</small></button><button class="z3" data-z="2">음료 냉장<small>쇼케이스 2대</small></button><button class="z4" data-z="3">간편식<small>1대</small></button><button class="z5" data-z="4">문구·생활<small>선반 1열</small></button><button class="z6" data-z="5">출입 인증<small>입구</small></button><button class="z7" data-z="6">결제 키오스크 2대<small>출구 쪽</small></button></div>
<div class="zd" id="zD" aria-live="polite"></div></div></div></section>

<section class="sec why" id="why"><div class="w"><h2 class="h2 O">사람이 없는 시간을 기계가 메웁니다</h2><p class="ld">무인 매장의 걱정은 결제 누락, 도난, 재고 공백 세 가지입니다. 하이픽은 이 셋을 각각 다른 장치로 나눠 맡깁니다.</p>
<div class="wg"><article><span class="k">결제</span><h3>셀프 키오스크 2대</h3><p>바코드 스캔과 카드·간편결제. 결제 오류는 화면 안내와 본사 콜센터 연결로 처리합니다.</p><div class="vis">시간대별 결제(예시 화면)<div class="bars"><i style="height:20%"></i><i style="height:35%"></i><i style="height:30%"></i><i style="height:55%"></i><i style="height:80%"></i><i style="height:95%"></i><i style="height:70%"></i><i style="height:40%"></i></div></div></article>
<article><span class="k">출입</span><h3>본인 인증 출입</h3><p>심야 시간에는 카드·앱 인증 후 문이 열리도록 설정할 수 있습니다. 출입 기록이 남습니다.</p><div class="vis">23:00~07:00 인증 출입 설정 가능</div></article>
<article><span class="k">감시</span><h3>CCTV 이상 알림</h3><p>장시간 체류, 결제 없는 퇴장 등 설정한 상황에서 점주 휴대폰으로 알림이 갑니다.</p><div class="vis">알림 조건은 점주가 직접 설정</div></article>
<article><span class="k">재고</span><h3>판매 기반 발주 제안</h3><p>판매 데이터로 부족 품목과 권장 수량을 제안합니다. 점주는 확인 버튼만 누릅니다.</p><div class="vis">주 2회 배송 일정에 맞춰 제안</div></article></div></div></section>

<section class="sec" id="sim"><div class="w"><h2 class="h2 O">관리 시간 대비 얼마가 남을까</h2><p class="ld">하루 결제 건수와 객단가, 관리 방식을 바꾸면 점주 앱처럼 월 손익이 나옵니다. 상품 마진과 고정비는 12평 표준 매장 기준 가정값입니다.</p>
<div class="sm"><div class="ctl"><label><span class="r">하루 결제 건수<output id="vN"></output></span><input id="iN" type="range" min="40" max="300" step="5" value="110" aria-label="하루 결제 건수"></label>
<label><span class="r">평균 객단가<output id="vA"></output></span><input id="iA" type="range" min="3000" max="9000" step="100" value="5200" aria-label="평균 객단가"></label>
<div style="margin-bottom:20px"><span class="r" style="font-weight:500">관리 방식</span><div class="tg" role="group" aria-label="관리 방식"><button data-m="0" aria-pressed="true">점주 직접</button><button data-m="1" aria-pressed="false">관리 대행</button></div></div>
<p class="asm">가정 — 상품 원가 매출의 70% · 카드·결제 수수료 2% · 임대료 150만원 · 전기(냉동고 6대)·통신·CCTV 구독 70만원 · 관리 대행 시 월 90만원 · 점주 직접 관리 하루 30분 · 세금·감가상각 미반영</p></div>
<div class="db" aria-live="polite"><div class="c"><small>월 매출</small><b id="dS"></b></div><div class="c"><small>월 결제</small><b id="dC"></b></div><div class="c hi"><small>점주 몫(세전)</small><b id="dP"></b></div>
<div class="c wide"><small>30일 매출 흐름 (예시 패턴: 주말 1.3배 가정)</small><div class="ch" id="dCh"></div><div class="lg2"><span>평일</span><span>주말</span></div></div>
<div class="c" style="grid-column:span 2"><table id="dT"></table></div><div class="c"><small>관리 1시간당</small><b id="dH"></b><small id="dHs"></small></div>
<p class="ex">예시 계산입니다. 실제 매출과 수익은 상권·상품 구성·운영에 따라 다르며 보장되지 않습니다.</p></div></div></div></section>

<section class="sec" style="padding-top:0"><div class="w ck"><div><h2 class="h2 O">무인 매장이 맞는지 먼저 체크해 보세요</h2><p class="ld" style="margin-bottom:24px">해당하는 항목을 고르면 운영 적합도를 간단히 보여 드립니다. 상담 전 참고용입니다.</p>
<div class="cl" id="cL"><label><input type="checkbox">본업이 있어 매장에 상주하기 어렵다</label><label><input type="checkbox">하루 30분은 매장에 들를 수 있다</label><label><input type="checkbox">주거 밀집 지역에 10평 내외 점포를 알아보고 있다</label><label><input type="checkbox">휴대폰 앱으로 재고·매출을 확인하는 데 익숙하다</label><label><input type="checkbox">초기 2~3개월은 진열을 자주 바꿔 볼 의향이 있다</label></div></div>
<div class="meter" aria-live="polite"><small style="color:var(--mu)">운영 적합도 (예시 판단)</small><div class="tr"><i id="mI"></i></div><b id="mB" class="O">0 / 5</b><p id="mP">항목을 체크하면 결과가 나옵니다.</p></div></div></section>

<section class="sec" id="cost" style="background:#fff"><div class="w"><h2 class="h2 O">창업 비용 상세</h2><p class="ld">매장 크기를 고르면 항목별 예시 금액이 바뀝니다. 점포 임차 보증금·권리금·월세 제외, 부가세 별도입니다.</p>
<div class="tabs" role="tablist"><button role="tab" data-t="0" aria-selected="false">8평 소형</button><button role="tab" data-t="1" aria-selected="true">12평 표준</button><button role="tab" data-t="2" aria-selected="false">18평 대형</button></div>
<div class="cgrid" id="cG"></div><p class="cnote">초도 상품은 판매 후 매출로 회수되는 재고 비용입니다. 이행보증금은 계약 종료 시 정산 후 반환합니다. 모든 금액은 제작 예시이며 실제 조건은 정보공개서에 따릅니다.</p></div></section>

<section class="sec ar" id="area"><div class="w ag"><div><h2 class="h2 O">희망 지역 개설 가능 여부</h2><p class="ld" style="margin-bottom:24px">구·시 이름을 입력하거나 아래에서 고르세요. 예시 데이터이며 실제 영업지역은 가맹계약서에 명시합니다.</p>
<form class="srch" id="aF"><input id="aI" placeholder="예: 노원구, 화성시" aria-label="지역 검색" list="aL"><datalist id="aL"></datalist><button>확인</button></form><div class="qk" id="aQ"></div></div>
<div class="ares" id="aR" aria-live="polite"><span class="bd">조회 전</span><h3>지역을 입력해 주세요</h3><p>개설 가능 여부와 주변 상권 특성을 함께 보여 드립니다.</p></div></div></section>

<section class="sec"><div class="w"><h2 class="h2 O">본사가 맡는 일</h2><p class="ld">교육은 짧게, 원격 지원은 길게. 무인 매장 운영에 맞춘 지원 구조입니다(예시).</p>
<div class="sg"><article><h3>교육 2일</h3><p>본사 직영 무인 매장에서 실습합니다.</p><ul><li><b>1일차</b>진열 기준·상품 회전·유통기한</li><li><b>1일차</b>점주 앱·발주·정산 화면</li><li><b>2일차</b>키오스크 오류·환불 처리</li><li><b>2일차</b>CCTV 알림 설정·출입 인증</li></ul></article>
<article><h3>오픈 지원</h3><p>설치부터 첫 진열까지 본사가 함께합니다.</p><ul><li><b>D-3</b>키오스크·CCTV·출입 단말 설치</li><li><b>D-1</b>초도 상품 입고·진열</li><li><b>D-day</b>본사 담당자 현장 점검</li><li><b>D+14</b>판매 데이터로 진열 조정</li></ul></article>
<article><h3>물류·원격 지원</h3><p>상품은 정해진 요일에, 문제는 원격으로.</p><ul><li><b>배송</b>주 2회 (냉동·상온 합배송)</li><li><b>마감</b>배송 전날 13시 앱 발주</li><li><b>콜센터</b>결제 오류 응대 (예시 운영 시간)</li><li><b>원격</b>키오스크 원격 점검·업데이트</li></ul></article></div></div></section>

<section class="sec" id="step" style="padding-top:0"><div class="w"><h2 class="h2 O">상담부터 오픈까지 약 4주</h2><p class="ld">점포가 확보된 경우의 예시 일정입니다.</p>
<ol class="stp"><li><small>1주</small><h3>창업 상담</h3><p>예산·지역·관리 방식</p></li><li><small>1주</small><h3>정보공개서 제공</h3><p>14일 숙려 기간</p></li><li><small>1~2주</small><h3>상권 확인</h3><p>주거 밀도·경쟁점</p></li><li><small>3주</small><h3>가맹계약</h3><p>계약서 사전 검토 후</p></li><li><small>3~4주</small><h3>인테리어</h3><p>약 10일 시공</p></li><li><small>4주</small><h3>교육·설치</h3><p>교육 2일, 장비 설치</p></li><li class="on"><small>4주</small><h3>오픈</h3><p>초도 진열 후 영업</p></li></ol>
<p class="warn">정보공개서를 받은 날부터 14일이 지나기 전에는 가맹계약을 체결하거나 가맹금을 받지 않습니다.</p></div></section>

<section class="sec" style="padding-top:0"><div class="w"><h2 class="h2 O">매장 사진</h2><p class="ld">사진은 연출 예시입니다.</p><div class="gs"><figure><img data-im="frUnmanned:4" alt="주택가 골목에 불이 켜진 무인 매장 외관"><figcaption>주택가 외관</figcaption></figure><figure><img data-im="frUnmanned:2" alt="색색의 아이스크림이 담긴 냉동고"><figcaption>아이스크림 냉동고 존</figcaption></figure><figure><img data-im="frUnmanned:1" alt="키오스크에서 상품 바코드를 찍는 손"><figcaption>셀프 결제</figcaption></figure><figure><img data-im="frUnmanned:3" alt="집에서 휴대폰으로 매장 CCTV와 매출을 확인하는 점주"><figcaption>점주 원격 확인</figcaption></figure></div></div></section>

<section class="sec lgl" id="legal"><div class="w"><h2 class="h2 O">정보공개서·가맹계약 안내</h2><p class="ld">가맹사업거래의 공정화에 관한 법률에 따라 계약 전 다음 사항을 지킵니다.</p>
<div class="lg3"><div><h3>정보공개서 제공</h3><p>상담 후 정보공개서를 서면 또는 전자문서로 드립니다. 제공일부터 14일이 지나기 전에는 계약 체결과 가맹금 수령을 하지 않습니다.</p></div><div><h3>계약서 사전 제공</h3><p>계약 전에 가맹계약서를 미리 드리고 계약 기간·갱신·해지·필수 구입 품목을 설명합니다.</p></div><div><h3>가맹금 예치</h3><p>가맹금은 법령에 따른 예치기관에 예치하며 절차를 계약 시 안내합니다.</p></div><div><h3>영업지역</h3><p>영업지역을 계약서에 명시하며 계약 기간 중 그 안에 동일 업종 직영점·가맹점을 내지 않습니다.</p></div><div class="x"><h3>손익 계산에 대한 고지</h3><p>이 페이지의 손익 계산, 적합도 체크, 비용표는 이해를 돕기 위한 예시이며 예상매출액 산정서가 아닙니다. 무인 매장도 상권과 상품 구성, 관리 빈도에 따라 결과가 크게 달라집니다.</p></div></div></div></section>

<section class="sec fq" id="faq"><div class="w g"><div><h2 class="h2 O">자주 묻는 질문</h2><p style="color:var(--mu)">무인 매장 상담에서 가장 많이 받는 질문입니다.</p></div><div>
<details open><summary>도난이 생기면 어떻게 하나요?</summary><p>CCTV 녹화와 결제 기록으로 상황을 확인할 수 있도록 안내하고, 이상 알림 조건을 설정해 빠르게 인지하도록 돕습니다. 대응 절차는 교육에서 다룹니다.</p></details>
<details><summary>하루 30분이면 정말 충분한가요?</summary><p>진열·청소·유통기한 확인 기준 시간이며, 입고일에는 30분~1시간이 더 걸립니다. 직접 관리가 어렵다면 관리 대행 옵션을 선택할 수 있습니다.</p></details>
<details><summary>상품은 본사 것만 팔아야 하나요?</summary><p>본사 공급 품목이 기본이며, 일부 품목은 본사 기준 안에서 점주가 추가할 수 있습니다. 필수 구입 품목은 정보공개서에 기재됩니다.</p></details>
<details><summary>키오스크가 고장 나면요?</summary><p>2대 중 1대가 멈춰도 결제가 가능하도록 2대를 기본 구성합니다. 원격 점검 후 필요하면 방문 수리를 접수합니다.</p></details>
<details><summary>여름·겨울 매출 차이가 크지 않나요?</summary><p>아이스크림 비중이 높아 계절 영향을 받습니다. 겨울에는 간식·간편식 진열 비율을 늘리는 진열도를 함께 드립니다.</p></details>
<details><summary>본업과 병행해도 되나요?</summary><p>병행 점주를 전제로 설계한 모델입니다. 다만 오픈 첫 달은 진열 조정을 위해 하루 두 번 방문을 권장합니다.</p></details></div></div></section>

<section class="sec ct" id="form"><div class="w g"><div><h2 class="h2 O">창업 상담 신청</h2><p class="ld" style="margin-bottom:24px">영업일 기준 2일 안에 담당자가 연락드립니다.</p><div class="info"><dl><div><dt>본사</dt><dd>서울 ○○구 ○○로 00, 하이픽 운영센터</dd></div><div><dt>상담</dt><dd>평일 10:00~19:00</dd></div><div><dt>견학</dt><dd>직영 매장 견학 · 매주 목요일 11:00(예시)</dd></div><div><dt>전화</dt><dd>02-000-0000</dd></div></dl></div></div>

.sp .g{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--ln);border:1px solid var(--ln)}.sp article{background:var(--bg);padding:32px}
.sp h3{font:400 32px 'Do Hyeon',sans-serif;margin:0 0 6px}.sp p{color:var(--st);margin:0 0 18px;font-size:15px}.sp ol,.sp ul{margin:0;padding:0;list-style:none;font-size:14px}.sp li{display:flex;gap:14px;padding:9px 0;border-top:1px solid var(--ln)}.sp li b{color:var(--co);min-width:62px}
/* steps */
.tl{display:grid;grid-template-columns:repeat(8,1fr);gap:0;list-style:none;margin:0;padding:0;border-top:4px solid var(--ln);position:relative}
.tl:before{content:"";position:absolute;top:-4px;left:0;width:100%;height:4px;background:linear-gradient(90deg,var(--co),var(--sk))}
.tl li{padding:22px 14px 0 0}.tl small{display:block;font:400 30px/1 'Do Hyeon',sans-serif;color:var(--st)}.tl h3{font-size:16px;margin:12px 0 4px}.tl p{margin:0;font-size:13px;color:var(--st);line-height:1.6}.tl li:last-child small{color:var(--co)}
.tln{margin-top:30px;font-size:14px;color:#BFC7D1;background:var(--bg2);padding:14px 18px;border-left:4px solid var(--co)}
/* gallery */
.gs{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:300px 300px;gap:4px}.gs figure{margin:0;position:relative}.gs figure:first-child{grid-row:1/3}.gs img{width:100%;height:100%;object-fit:cover}.gs figcaption{position:absolute;left:0;bottom:0;background:var(--bg);padding:6px 14px;font-size:13px}
/* legal */
.lg2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln);border:1px solid var(--ln)}.lg2 div{background:var(--bg);padding:26px}.lg2 h3{margin:0 0 6px;font-size:17px}.lg2 p{margin:0;color:#BFC7D1;font-size:14px}.lg2 .x{grid-column:1/-1;background:var(--bg2)}
/* faq */
.fq .g{display:grid;grid-template-columns:1fr 2fr;gap:56px}.fq details{border-bottom:1px solid var(--ln);padding:20px 0}.fq details:first-child{border-top:1px solid var(--ln)}
.fq summary{cursor:pointer;font:400 22px 'Do Hyeon',sans-serif;list-style:none;display:flex;justify-content:space-between;gap:16px}.fq summary::-webkit-details-marker{display:none}.fq summary:after{content:"+";color:var(--co)}.fq details[open] summary:after{content:"−"}.fq details p{margin:10px 0 0;color:#BFC7D1}
/* contact */
.ct{background:var(--co);color:#fff}.ct .g{display:grid;grid-template-columns:1fr 1.2fr;gap:56px}.ct h2{font-size:clamp(56px,7vw,110px);line-height:.95}
.ct dl{margin:30px 0 0}.ct dl div{display:grid;grid-template-columns:100px 1fr;padding:11px 0;border-top:1px solid rgba(255,255,255,.35)}.ct dt{opacity:.8}.ct dd{margin:0;font-weight:700}
.fm{background:var(--bg);color:var(--ch);padding:32px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.fm label{display:grid;gap:6px;font-size:13px;color:var(--st);font-weight:700}.fm .f{grid-column:1/-1}
.fm input,.fm select,.fm textarea{background:var(--bg2);border:1px solid var(--ln);color:var(--ch);padding:12px;font-size:16px;border-radius:4px;width:100%}
.fm .ck{grid-column:1/-1;display:flex;gap:8px;font-weight:400;font-size:13px;align-items:flex-start}.fm .ck input{width:18px;height:18px;margin-top:2px;accent-color:var(--co)}
.fm button{grid-column:1/-1;background:var(--co);color:#fff;border:0;padding:18px;font-size:18px;font-weight:800;border-radius:4px;cursor:pointer}
.ft{padding:40px 0;font-size:13px;color:var(--st)}.ft .w{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.ft b{font:400 22px 'Do Hyeon',sans-serif;color:var(--ch)}.ft nav{display:flex;gap:16px}
@media(max-width:1060px){.nv nav,.cta{display:none}.bq{display:block}.nv.op nav{display:flex;flex-direction:column;position:absolute;top:64px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--ln);padding:6px 24px 16px;gap:0}.nv.op nav a{padding:12px 0;border-bottom:1px solid var(--ln);color:var(--ch)}
.hr{grid-template-columns:1fr;min-height:0}.hl{padding:56px 36px}.hp img{aspect-ratio:4/3;height:auto}.hp figcaption{position:static}
.dg,.sg,.cg,.ag,.fq .g,.ct .g{grid-template-columns:1fr}.dial{margin:0 auto}.fz{grid-template-columns:1fr}.fz figure{min-height:320px}.wt div{grid-template-columns:1fr;gap:8px}.sp .g{grid-template-columns:1fr}.tl{grid-template-columns:repeat(4,1fr);row-gap:30px}}
@media(max-width:600px){.w{padding:0 18px}.hl{padding:44px 18px}.hl .bg24{font-size:240px}.sec{padding:80px 0}.hp b{font-size:22px}.hp figcaption div{padding:12px}
.dial{width:330px;height:330px}.dial .hole{inset:52px}.dial .hole b{font-size:46px}.dial button{width:26px;height:26px;margin:-13px 0 0 -13px;font-size:9px}.dp ul{grid-template-columns:1fr}
.kp{grid-template-columns:1fr 1fr}.kp div:nth-child(3){border-left:0}.kp div:nth-child(n+3){border-top:1px solid #CDD2D8}.chart{padding:14px 10px 8px}.chart text{font-size:22px}
.af{grid-template-columns:1fr 1fr}.af button{grid-column:1/-1;padding:14px}.ares dl{grid-template-columns:1fr}.tl{grid-template-columns:1fr 1fr}.gs{grid-template-columns:1fr;grid-template-rows:240px 180px 180px}.gs figure:first-child{grid-row:auto}
.lg2{grid-template-columns:1fr}.fm{grid-template-columns:1fr;padding:20px}.stack i{font-size:0}.ctot b{font-size:36px}}`,
h:`<header class="nv"><div class="w"><a class="lg H" href="#top">핏라인<span>24</span></a><nav aria-label="주요 메뉴"><a href="#hour">24시간 운영</a><a href="#sim">손익분기</a><a href="#zone">시설</a><a href="#cost">창업 비용</a><a href="#area">입지 확인</a><a href="#step">절차</a><a href="#faq">FAQ</a></nav><a class="cta" href="#form">가맹 상담</a><button class="bq" aria-expanded="false">메뉴</button></div></header>
<section class="hr" id="top"><div class="hl"><span class="bg24" aria-hidden="true">24</span><small>24시간 피트니스 가맹점 모집</small><h1 class="H">24시간 열고,<br>12시간만 지킵니다</h1><p>매니저는 회원이 몰리는 10시부터 22시까지. 그 밖의 시간은 앱 출입, 원격 CCTV, 비상 호출이 지킵니다. 인건비 구조를 24시간이 아니라 12시간에 맞춘 피트니스 매장입니다.</p><div class="bt"><a href="#sim">손익분기 회원 수 보기</a><a href="#form">가맹 상담 신청</a></div></div>
<figure class="hp"><img data-im="frFit:0" alt="밤 시간 조명이 켜진 텅 빈 24시간 헬스장"><figcaption><div><b>100평</b><span>표준 매장 면적</span></div><div><b>12시간</b><span>매니저 상주 시간</span></div><div><b>약 8주</b><span>계약→오픈(예시)</span></div></figcaption></figure></section>

<section class="sec" id="hour"><div class="w dg"><div><div class="dial" id="dl" role="group" aria-label="24시간 운영 다이얼"><div class="hole"><span><b id="dlN">22</b>시 운영 모드</span></div></div><div class="dkey"><span style="--c:#5BA8FF">매니저 상주</span><span style="--c:#FF5A4E">무인 운영</span></div></div>
<div><h2 class="h2 H">하루 24칸, 누가 지키나</h2><p class="ld" style="margin-bottom:28px">시각을 누르면 그 시간에 매장이 어떻게 운영되는지 나옵니다. 상주 시간은 상권에 따라 조정할 수 있습니다(예시).</p><div class="dp" id="dP" aria-live="polite"></div></div></div></section>

<section class="sec sim" id="sim"><div class="w"><h2 class="h2 H">몇 명이 모이면 남기 시작할까</h2><p class="ld">회원 수에 따라 월 손익이 어떻게 바뀌는지 선으로 보여 드립니다. 빨간 점이 현재 설정, 선이 0을 넘는 지점이 손익분기 회원 수입니다. 100평 표준 매장 기준 가정값입니다.</p>
<div class="sg"><div class="ctl"><label><span class="r">유효 회원 수<output id="vM"></output></span><input id="iM" type="range" min="100" max="1000" step="10" value="420" aria-label="유효 회원 수"></label>
<label><span class="r">월 평균 회비<output id="vF"></output></span><input id="iF" type="range" min="39000" max="89000" step="1000" value="55000" aria-label="월 평균 회비"></label>
<label><span class="r">월 PT 매출(점주 몫)<output id="vT"></output></span><input id="iT" type="range" min="0" max="1500" step="50" value="400" aria-label="월 PT 매출"></label>
<p class="asm">가정 — 임대료 900만원 · 매니저 2명 교대 인건비 600만원 · 전기·수도·관리비 350만원 · 장비 리스·유지보수 250만원 · 앱·출입·CCTV 구독 40만원 · 결제 수수료·소모품 매출의 4% · 세금 미반영</p></div>
<div><div class="chart"><p style="margin:0 0 6px;font-size:12px;color:#55606C">월 손익(만원) — 가로축 유효 회원 수</p><svg id="sv" viewBox="0 0 640 300" role="img" aria-label="회원 수에 따른 월 손익 선 그래프"></svg></div><div class="kp" aria-live="polite"><div><small>월 매출</small><b id="kS"></b></div><div><small>월 비용</small><b id="kC"></b></div><div class="hi"><small>점주 몫(세전)</small><b id="kP"></b></div><div><small>손익분기 회원</small><b id="kB"></b></div></div><p class="exn">예시 계산입니다. 실제 매출과 수익은 상권·임대 조건·운영에 따라 다르며 보장되지 않습니다.</p></div></div></div></section>

<section class="sec" id="zone"><div class="w"><h2 class="h2 H">100평에 넣는 다섯 구역</h2><p class="ld">구역을 누르면 장비 구성과 운영 기준이 열립니다. 장비 브랜드와 수량은 평면에 맞춰 본사가 배치안을 드립니다.</p>
<div class="fz"><figure><img id="zI" data-im="frFit:1" alt="스쿼트 랙에서 운동하는 사람"></figure><ul class="fl" id="zL">
<li><button aria-expanded="true" data-i="1"><b>프리웨이트</b><span>약 30평</span><p>파워랙 4대, 스미스 머신 2대, 덤벨 2~40kg. 고무 바닥 30mm. 야간 이용이 가장 많은 구역입니다.</p></button></li>
<li><button aria-expanded="false" data-i="4"><b>유산소</b><span>약 20평</span><p>트레드밀 10대, 사이클 6대, 스텝밀 2대. 창가 배치를 기본으로 합니다.</p></button></li>
<li><button aria-expanded="false" data-i="3"><b>머신 웨이트</b><span>약 25평</span><p>부위별 셀렉토라이즈드 머신 14대. 초보 회원을 위한 QR 사용법 안내를 붙입니다.</p></button></li>
<li><button aria-expanded="false" data-i="2"><b>출입·라운지</b><span>약 10평</span><p>앱 QR 출입 게이트, 비상 호출 버튼, 무인 시간 안내 디스플레이.</p></button></li>
<li><button aria-expanded="false" data-i="0"><b>탈의실·샤워</b><span>약 15평</span><p>남녀 샤워 각 4부스, 락커 120개. 무인 시간 청소는 오전 매니저가 점검합니다.</p></button></li></ul></div></div></section>

<section class="sec" style="padding-top:0"><div class="w"><h2 class="h2 H">왜 핏라인 24인가</h2><p class="ld">24시간 헬스장의 비용은 대부분 사람과 공간에서 나옵니다. 운영 구조를 이 두 가지에 맞춰 짰습니다.</p>
<div class="wt"><div><h3>상주 12시간</h3><p>회원 이용이 몰리는 낮·저녁에만 매니저 2명이 교대로 상주하고, 심야·새벽은 무인으로 운영합니다.</p><p class="vs"><b>무인 시간 안전 장치</b>앱 출입 기록, CCTV 원격 확인, 비상 호출 버튼, 본사 야간 콜 연결(예시)</p></div>
<div><h3>앱 하나로 회원 관리</h3><p>등록·결제·출입·휴회를 회원 앱에서 처리합니다. 데스크 업무가 줄어 매니저는 운동 지도와 청소에 집중합니다.</p><p class="vs"><b>점주 화면</b>시간대별 출입 수, 만료 예정 회원, 장비 고장 접수</p></div>
<div><h3>PT는 선택형</h3><p>트레이너를 직접 고용하지 않고 본사 제휴 트레이너가 수수료 방식으로 PT를 진행하는 구조를 선택할 수 있습니다.</p><p class="vs"><b>점주 선택</b>직접 고용 / 제휴 트레이너 / PT 미운영</p></div>
<div><h3>장비는 리스 가능</h3><p>초기 비용 부담을 줄이기 위해 유산소·머신 장비 일부를 리스로 들일 수 있습니다. 리스 조건은 상담에서 비교해 드립니다.</p><p class="vs"><b>유지보수</b>분기 1회 정기 점검, 고장 접수 앱</p></div></div></div></section>

<section class="sec cost" id="cost"><div class="w"><h2 class="h2 H">창업 비용 상세</h2><p class="ld">평형을 고르면 비용 구성이 막대와 표로 바뀝니다. 장비는 전액 구매 기준이며, 리스 선택 시 초기 비용이 줄어듭니다. 점포 임차 보증금·권리금·월세 제외, 부가세 별도.</p>
<div class="tabs" role="tablist"><button role="tab" data-t="0" aria-selected="false">60평 콤팩트</button><button role="tab" data-t="1" aria-selected="true">100평 표준</button><button role="tab" data-t="2" aria-selected="false">150평 GX 포함</button></div>
<div class="cg"><div><div class="stack" id="cS" aria-hidden="true"></div><table class="ctab"><tbody id="cB"></tbody></table><div class="ctot"><span>예시 합계</span><b id="cT"></b></div></div>
<div class="cn"><p>가맹비·교육비·이행보증금은 계약 시 납부하며, 이행보증금은 계약 종료 시 정산 후 반환합니다.</p><p>샤워실 급배수·전기 증설·방음 공사는 건물 상태에 따라 금액 차이가 큽니다. 실측 후 별도 견적합니다.</p><p>헬스장은 체육시설 신고 등 인허가 요건이 있으며, 점포 계약 전 본사가 요건 검토를 돕습니다.</p><p>모든 금액은 제작 예시이며 실제 조건은 정보공개서에 따릅니다.</p></div></div></div></section>

<section class="sec" id="area"><div class="w ag"><div><h2 class="h2 H">입지, 먼저 맞춰 봅니다</h2><p class="ld" style="margin-bottom:28px">시·도와 구·시를 고르면 개설 가능 여부와 상권 특성을 보여 드립니다. 예시 데이터이며 실제 영업지역은 가맹계약서에 명시합니다.</p>
<div class="af"><select id="aA" aria-label="시·도"><option>서울</option><option>경기</option><option>인천</option><option>대전</option></select><select id="aB" aria-label="구·시"></select><button id="aG">확인</button></div></div>
<div class="ares" id="aR" aria-live="polite"><div class="s">—</div><h3>지역을 선택해 주세요</h3><p>야간 유동, 주거 밀도, 권장 평형을 함께 알려 드립니다.</p></div></div></section>

<section class="sec sp" style="padding-top:0"><div class="w"><h2 class="h2 H">본사가 맡는 일</h2><p class="ld">점주 교육, 오픈 지원, 운영 시스템을 묶어서 지원합니다(예시).</p>
<div class="g"><article><h3>교육 3일</h3><p>점주와 매니저가 함께 듣습니다.</p><ol><li><b>1일차</b>회원 앱·출입·결제 시스템</li><li><b>1일차</b>무인 시간 안전 매뉴얼</li><li><b>2일차</b>장비 안전 점검·고장 접수</li><li><b>2일차</b>위생·청소 체크리스트</li><li><b>3일차</b>회원 상담·등록 실습</li></ol></article>
<article><h3>오픈 지원</h3><p>오픈 전 회원 모집부터 함께합니다.</p><ul><li><b>D-30</b>사전 등록 페이지·현수막</li><li><b>D-14</b>장비 반입·배치</li><li><b>D-7</b>출입 시스템 시험 운영</li><li><b>D-day</b>본사 담당자 현장 지원</li><li><b>D+30</b>시간대별 이용 분석</li></ul></article>
<article><h3>운영 시스템</h3><p>매장 운영에 필요한 시스템을 본사가 유지합니다.</p><ul><li><b>앱</b>회원 등록·결제·출입</li><li><b>CCTV</b>원격 확인·녹화 보관</li><li><b>호출</b>비상 호출 연결 체계</li><li><b>장비</b>분기 정기 점검</li><li><b>마케팅</b>지역 광고 소재 제공</li></ul></article></div></div></section>

<section class="sec" id="step" style="padding-top:0"><div class="w"><h2 class="h2 H">상담에서 오픈까지 약 8주</h2><p class="ld">점포 확보 후 기준 예시 일정입니다. 인허가와 공사 범위에 따라 달라집니다.</p>
<ol class="tl"><li><small>W1</small><h3>가맹 상담</h3><p>예산·입지·운영 방식</p></li><li><small>W1</small><h3>정보공개서</h3><p>14일 숙려 기간</p></li><li><small>W2</small><h3>입지 검토</h3><p>층고·하중·인허가</p></li><li><small>W3</small><h3>가맹계약</h3><p>계약서 사전 검토 후</p></li><li><small>W3~7</small><h3>공사</h3><p>약 4~5주</p></li><li><small>W4</small><h3>사전 회원 모집</h3><p>오픈 30일 전</p></li><li><small>W7</small><h3>교육·장비</h3><p>교육 3일, 반입</p></li><li><small>W8</small><h3>오픈</h3><p>24시간 운영 시작</p></li></ol>
<p class="tln">정보공개서를 받은 날부터 14일이 지나기 전에는 가맹계약을 체결하거나 가맹금을 받지 않습니다.</p></div></section>

<section class="sec" style="padding-top:0"><div class="w"><h2 class="h2 H">매장 사진</h2><p class="ld">사진은 연출 예시입니다.</p><div class="gs"><figure><img data-im="frFit:4" alt="도시 야경이 보이는 창가의 트레드밀 구역"><figcaption>창가 유산소 존</figcaption></figure><figure><img data-im="frFit:2" alt="앱으로 체크인하는 출입 게이트"><figcaption>앱 출입 게이트</figcaption></figure><figure><img data-im="frFit:3" alt="트레이너가 회원을 지도하는 모습"><figcaption>PT 운영 예시</figcaption></figure></div></div></section>

<section class="sec" id="legal" style="padding-top:0"><div class="w"><h2 class="h2 H">정보공개서·가맹계약 안내</h2><p class="ld">가맹사업거래의 공정화에 관한 법률에 따라 계약 전 다음 사항을 지킵니다.</p>
<div class="lg2"><div><h3>정보공개서 제공</h3><p>상담 후 정보공개서를 서면 또는 전자문서로 제공합니다. 제공일로부터 14일이 지나기 전에는 계약 체결과 가맹금 수령을 하지 않습니다.</p></div><div><h3>가맹계약서 사전 제공</h3><p>계약 체결 전 계약서를 미리 드리고 계약 기간·갱신·해지 조건과 장비 구입·리스 조건을 설명합니다.</p></div><div><h3>가맹금 예치</h3><p>가맹금은 법령에 따른 예치기관에 예치하며 계약 시 절차를 안내합니다.</p></div><div><h3>영업지역</h3><p>영업지역을 계약서에 명시하며 계약 기간 중 그 안에 동일 업종 직영점·가맹점을 내지 않습니다.</p></div><div class="x"><h3>손익 계산에 대한 고지</h3><p>이 페이지의 손익분기 계산과 비용표는 이해를 돕기 위한 예시이며 예상매출액 산정서가 아닙니다. 회원 수와 회비는 상권·경쟁·운영에 따라 크게 달라집니다.</p></div></div></div></section>

<section class="sec fq" id="faq" style="padding-top:0"><div class="w g"><div><h2 class="h2 H">자주 묻는 질문</h2><p style="color:var(--st)">가맹 상담에서 자주 받는 질문입니다.</p></div><div>
<details open><summary>무인 시간에 사고가 나면 어떻게 하나요?</summary><p>매장 곳곳의 비상 호출 버튼과 CCTV 원격 확인 체계를 갖추고, 대응 절차를 교육에서 다룹니다. 무인 시간 이용 안내와 이용 약관도 본사 표준안을 드립니다.</p></details>
<details><summary>운동을 잘 몰라도 운영할 수 있나요?</summary><p>점주는 매장 운영과 회원 관리에 집중하는 구조입니다. 운동 지도는 매니저와 제휴 트레이너가 맡습니다.</p></details>
<details><summary>트레이너 채용은 어떻게 하나요?</summary><p>직접 고용, 본사 제휴 트레이너 수수료 방식, PT 미운영 중 선택할 수 있습니다. 각 방식의 장단점을 상담에서 비교해 드립니다.</p></details>
<details><summary>기존 헬스장을 전환할 수 있나요?</summary><p>장비와 시설 상태를 점검해 재사용 가능한 항목을 빼고 견적을 드립니다. 출입 시스템과 사인은 교체합니다.</p></details>
<details><summary>층고나 바닥 하중 조건이 있나요?</summary><p>프리웨이트 구역 때문에 바닥 하중과 소음 조건을 확인합니다. 점포 계약 전에 본사 담당자가 현장을 함께 봅니다.</p></details>
<details><summary>로열티와 시스템 사용료는요?</summary><p>정기 납부 항목과 금액·산정 방식은 정보공개서와 가맹계약서에 모두 기재되며 상담 시 설명합니다.</p></details></div></div></section>
