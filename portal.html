<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 설계 진행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@1,62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{--ink:#070620;--ink2:#0c0a2a;--ink3:#131039;--ink4:#1c1850;--rule:#2b2766;--text:#f3f1ff;--mute:#a19dd0;--sig:#ff5ccf;--vio:#7a6bff;--soft:rgba(255,92,207,.12);--warn:#ffd23f;--bad:#ff2e4d;--ok:#4ff0b0;--grad:linear-gradient(90deg,#ff5ccf,#7a6bff);--glow:0 0 10px rgba(255,92,207,.55),0 0 32px rgba(255,92,207,.3);--fb:"Archivo","Arial Black",system-ui,sans-serif;--fs:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,monospace;--max:1240px;--g:clamp(16px,4vw,40px);color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--text);font:400 16px/1.6 var(--fs);overflow-x:hidden;background-image:radial-gradient(900px 500px at 85% -10%,rgba(122,107,255,.22),transparent 60%),radial-gradient(700px 400px at -10% 10%,rgba(255,92,207,.14),transparent 60%);background-attachment:fixed}
a{color:inherit}button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--g)}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
.mono{font-family:var(--fm);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
.dim{color:var(--mute)}
/* top */
.top{position:sticky;top:0;z-index:30;background:rgba(7,6,32,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:baseline;gap:8px;text-decoration:none;font:italic 900 1.2rem/1 var(--fb);letter-spacing:-.02em}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{font:600 .6rem var(--fm);letter-spacing:.3em;color:var(--sig);font-style:normal}
.top .sp{flex:1}
.back{font-size:.875rem;color:var(--mute);text-decoration:none;border:1px solid var(--rule);padding:7px 12px;border-radius:8px;white-space:nowrap}
.back:hover{color:var(--text);border-color:var(--sig)}
.demo-t{display:flex;align-items:center;gap:8px;border:1px dashed var(--warn);color:var(--warn);background:transparent;border-radius:999px;padding:6px 12px;font-size:.8125rem;font-weight:600;white-space:nowrap}
.demo-t i{width:30px;height:16px;border-radius:9px;background:var(--ink4);position:relative;flex:none}
.demo-t i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--mute);transition:.2s}
.demo-t[aria-pressed=true] i{background:var(--warn)}.demo-t[aria-pressed=true] i::after{left:16px;background:var(--ink)}
.demobar{background:repeating-linear-gradient(135deg,rgba(255,210,63,.14) 0 12px,rgba(255,210,63,.06) 12px 24px);border-bottom:1px solid rgba(255,210,63,.4);color:var(--warn)}
.demobar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:10px;padding-bottom:10px;font-size:.875rem}
.demobar b{font-family:var(--fm);letter-spacing:.1em}
.demobar button{margin-left:auto;background:var(--warn);color:var(--ink);border:0;border-radius:8px;padding:8px 14px;font-weight:700}
/* hero */
.hero{padding:34px 0 18px}
.hero .k{color:var(--sig)}
.hero h1{font:900 clamp(2rem,5vw,3.8rem)/1.05 var(--fs);letter-spacing:-.035em;margin:8px 0 6px;word-break:keep-all;overflow-wrap:anywhere}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--mute);max-width:720px}
/* journey */
.jr{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;margin:30px 0 6px;padding:0;position:relative}
.jr li{list-style:none;position:relative}
.jr button,.jr span.s{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:none;border:0;padding:0;color:var(--mute)}
.jr .bar{height:6px;border-radius:3px;background:var(--ink4)}
.jr .done .bar{background:var(--grad)}.jr .cur .bar{background:var(--sig);box-shadow:var(--glow)}
.jr .n{font:700 .8rem var(--fm)}.jr .l{font-size:.78rem;line-height:1.3;word-break:keep-all}
.jr .cur{color:var(--text)}.jr .cur .n{color:var(--sig)}.jr .done{color:#d7d3ff}
.jr .paid .bar{outline:1px dashed rgba(255,210,63,.35);outline-offset:2px}
.jr .fence{position:absolute;left:-3px;top:-14px;bottom:-4px;border-left:2px dashed var(--warn)}
.jr .fence b{position:absolute;top:-6px;left:6px;font:700 .65rem var(--fm);color:var(--warn);white-space:nowrap;letter-spacing:.06em}
.jr .fence b.f{left:auto;right:10px}
/* summary bar */
.sum{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--rule);border-radius:14px;background:rgba(19,16,57,.75);margin:18px 0 0;overflow:hidden}
.sum div{padding:14px 16px;border-right:1px solid var(--rule);min-width:0}
.sum div:last-child{border-right:0}
.sum dt{font:600 .68rem var(--fm);letter-spacing:.1em;color:var(--mute);margin-bottom:4px}
.sum dd{margin:0;font-size:.9rem;font-weight:600;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.sum .todo dd{color:var(--sig)}.sum .cost dd{color:var(--warn)}
.sum a{color:var(--sig)}
/* tabs */
.tabs{display:flex;gap:4px;margin:26px 0 0;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;padding:12px 14px;font-size:.9rem;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tabs a.on{color:var(--text);border-color:var(--sig)}
.tabs a.off{opacity:.45}
.tabs a i{font:700 .7rem var(--fm);color:var(--sig)}
.tabs .cnt{background:var(--sig);color:var(--ink);border-radius:9px;font-size:.7rem;padding:0 6px;font-weight:700}
main{padding-top:28px;padding-bottom:90px;min-height:50vh}
/* generic */
h2.t{font:800 clamp(1.6rem,3.4vw,2.6rem)/1.15 var(--fs);letter-spacing:-.03em;margin:0 0 8px;word-break:keep-all}
h3{font-size:1.1rem;margin:0 0 8px;letter-spacing:-.01em}
.lead{color:var(--mute);margin:0 0 22px;max-width:760px;word-break:keep-all}
.card{background:linear-gradient(180deg,rgba(28,24,80,.6),rgba(19,16,57,.6));border:1px solid var(--rule);border-radius:14px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--rule);background:var(--ink3);border-radius:10px;padding:11px 16px;font-weight:600;text-decoration:none;font-size:.95rem;text-align:center}
.btn:hover:not(:disabled){border-color:var(--sig)}
.btn.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 6px 24px rgba(255,92,207,.25)}
.btn.big{padding:16px 22px;font-size:1.05rem;font-weight:700}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--warn);color:var(--warn);background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:4px 11px;font-size:.82rem;background:var(--ink2)}
.chip.on{border-color:var(--sig);background:var(--soft);color:#fff}
.tag{display:inline-block;font:600 .68rem/1 var(--fm);letter-spacing:.06em;padding:4px 7px;border-radius:5px;border:1px solid currentColor;white-space:nowrap}
.tag.in{color:var(--ok)}.tag.as{color:var(--warn)}.tag.demo{color:var(--warn);border-style:dashed}.tag.lk{color:var(--mute)}.tag.p{color:var(--sig)}.tag.bad{color:var(--bad)}
.note{border-left:3px solid var(--warn);background:rgba(255,210,63,.07);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.875rem;color:#f4e6b0}
.note.p{border-color:var(--sig);background:var(--soft);color:#ffd8f3}
.list{margin:0;padding:0;list-style:none}
.list li{padding:10px 0;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:flex-start}
.list li:last-child{border-bottom:0}
label.f{display:block;font-size:.85rem;color:var(--mute);margin:12px 0 6px}
input.i,textarea.i,select.i{width:100%;background:var(--ink2);border:1px solid var(--rule);border-radius:10px;padding:11px 12px;font-size:.95rem}
textarea.i{min-height:90px;resize:vertical}
input.i:focus,textarea.i:focus,select.i:focus{border-color:var(--sig);outline:none}
.empty{text-align:center;padding:70px 20px}
.empty h2{font:900 clamp(1.8rem,4vw,3rem)/1.15 var(--fs);letter-spacing:-.03em;margin:0 0 10px}
.locked{border:1px dashed var(--rule);border-radius:14px;padding:30px;text-align:center;color:var(--mute)}
.locked b{display:block;color:var(--text);font-size:1.2rem;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink4);border:1px solid var(--sig);padding:12px 18px;border-radius:10px;z-index:99;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:var(--glow)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--mute);font-size:.875rem}.kv dd{margin:0;word-break:keep-all;overflow-wrap:anywhere}
/* status */
.prep{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding:0;margin:0}
.prep li{list-style:none;padding:18px;border:1px solid var(--rule);margin-left:-1px;position:relative}
.prep li:first-child{border-radius:14px 0 0 14px;margin:0}.prep li:last-child{border-radius:0 14px 14px 0}
.prep .s{font:700 .7rem var(--fm);letter-spacing:.08em}
.prep .done{background:rgba(255,92,207,.08)}.prep .done .s{color:var(--sig)}
.prep .doing{background:rgba(122,107,255,.12)}.prep .doing .s{color:#b9b0ff}
.prep .todo .s{color:var(--mute)}
.prep b{display:block;font-size:1.05rem;margin:6px 0 2px}
.ready{padding:30px;border-radius:18px;background:linear-gradient(120deg,rgba(255,92,207,.18),rgba(122,107,255,.18));border:1px solid rgba(255,92,207,.5);margin-top:20px}
.ready h3{font:900 clamp(1.5rem,3vw,2.3rem)/1.2 var(--fs);letter-spacing:-.03em;margin:0 0 10px;word-break:keep-all}
/* plan */
.plan-sec{display:grid;grid-template-columns:200px 1fr;gap:22px;padding:24px 0;border-top:1px solid var(--rule)}
.plan-sec>h3{font:800 1rem/1.3 var(--fs);color:var(--sig)}
.plan-sec>h3 span{display:block;font:600 .7rem var(--fm);color:var(--mute);letter-spacing:.1em;margin-bottom:4px}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:10px 0 4px}
.flow div{padding:12px;border:1px solid var(--rule);margin-left:-1px;font-size:.875rem;position:relative}
.flow div:first-child{margin-left:0;border-radius:10px 0 0 10px}.flow div:last-child{border-radius:0 10px 10px 0;background:var(--soft)}
.flow div small{display:block;font:600 .65rem var(--fm);color:var(--mute);letter-spacing:.08em;margin-bottom:3px}
.who{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:.82rem;margin-top:8px}
.who div{background:var(--ink2);border-radius:8px;padding:8px 10px}.who b{display:block;font-size:.7rem;color:var(--mute);font-weight:600}
.under{padding:26px;border-radius:16px;border:1px solid var(--sig);background:linear-gradient(120deg,rgba(255,92,207,.12),rgba(19,16,57,.5))}
/* draft sim */
.sim{--acc:#ff5ccf;border:1px solid var(--rule);border-radius:16px;overflow:hidden;background:#0b0a22}
.sim-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap;background:#0f0d2c}
.sim-h .mk{width:30px;height:30px;border-radius:8px;background:var(--acc);display:grid;place-items:center;font:900 .9rem var(--fb);color:#0b0a22;flex:none}
.sim-h .co{font-weight:800;min-width:0;overflow-wrap:anywhere}
.roles{display:flex;gap:4px;margin-left:auto;background:var(--ink2);padding:4px;border-radius:10px;flex-wrap:wrap}
.roles button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:.85rem;font-weight:600;color:var(--mute)}
.roles button.on{background:var(--acc);color:#0b0a22}
.sim-b{display:grid;grid-template-columns:200px 1fr;min-height:520px}
.sim-nav{border-right:1px solid var(--rule);padding:12px 8px;font-size:.85rem}
.sim-nav h6{margin:10px 8px 6px;font:600 .65rem var(--fm);letter-spacing:.1em;color:var(--mute)}
.sim-nav button{display:flex;width:100%;gap:8px;align-items:center;background:none;border:0;text-align:left;padding:7px 8px;border-radius:7px;color:#cfcbef}
.sim-nav button.on{background:rgba(255,255,255,.06);color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.sim-nav button.lk{color:var(--mute)}
.sim-m{padding:18px;min-width:0}
.sim-bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.sim-bar h4{margin:0;font-size:1.15rem}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kp div{background:var(--ink2);border:1px solid var(--rule);border-radius:10px;padding:12px}
.kp small{display:block;color:var(--mute);font-size:.75rem}.kp b{font:700 1.35rem var(--fm)}
.kp .up{color:var(--ok);font-size:.75rem}.kp .dn{color:var(--bad);font-size:.75rem}
.dec{border:1px solid var(--rule);border-left:3px solid var(--acc);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:rgba(255,255,255,.02)}
.dec p{margin:2px 0 0;font-size:.82rem;color:var(--mute)}
.dec.done{border-left-color:var(--ok);opacity:.8}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:12px 0}
.pipe div{border:1px solid var(--rule);border-radius:8px;padding:10px;font-size:.8rem;min-height:74px;transition:.3s}
.pipe div small{display:block;font:700 .62rem var(--fm);letter-spacing:.08em;color:var(--mute)}
.pipe div.on{border-color:var(--acc);background:rgba(255,255,255,.05)}
.pipe div.ok{border-color:var(--ok)}.pipe div.ok small{color:var(--ok)}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
.tbl th{font:600 .7rem var(--fm);color:var(--mute);letter-spacing:.06em}
.tbl td.r,.tbl th.r{text-align:right}
.tblw{overflow-x:auto}
.phone{width:300px;max-width:100%;margin:0 auto;border:8px solid #23204f;border-radius:34px;background:#0b0a22;padding:16px 12px;min-height:500px}
.push{background:rgba(255,255,255,.07);border-radius:12px;padding:10px;font-size:.8rem;margin-bottom:8px}
.lockv{display:grid;place-items:center;min-height:300px;text-align:center;border:1px dashed var(--rule);border-radius:12px;padding:20px;color:var(--mute)}
.screen-req{font-size:.8rem;padding:7px 11px}
.spec{display:grid;gap:2px;border:1px dashed var(--acc);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.82rem}
.sim.lt{--ink:#f6f5fb;--ink2:#fff;--ink3:#eeeaf8;--ink4:#e4e0f3;--rule:#dcd8ee;--mute:#6b6790;--text:#1a1733;color:#1a1733;background:#f6f5fb}
.sim.lt .sim-h{background:#fff}.sim.lt .sim-nav button{color:#3a3660}.sim.lt .sim-nav button.on{color:#000;background:rgba(0,0,0,.05)}.sim.lt .push{background:rgba(0,0,0,.05)}.sim.lt .phone{background:#fff;border-color:#d9d5ea}
/* dev */
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kinds button{border:1px solid var(--rule);background:var(--ink2);border-radius:10px;padding:12px;text-align:left;font-weight:600;font-size:.9rem}
.kinds button small{display:block;font-weight:400;color:var(--mute);font-size:.75rem;margin-top:2px}
.kinds button.on{border-color:var(--sig);background:var(--soft)}
.reco{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid rgba(122,107,255,.5);border-radius:10px;background:rgba(122,107,255,.08);margin-top:8px}
.reco p{margin:2px 0 0;font-size:.85rem;color:var(--mute)}
.reco button{margin-left:auto;flex:none}
.rcpt{border:1px solid var(--sig);border-radius:16px;padding:24px;background:var(--soft)}
.rcpt .no{font:800 2.2rem var(--fm);letter-spacing:.02em}
.st{font:600 .72rem var(--fm);padding:3px 8px;border-radius:5px;white-space:nowrap}
.st.received{background:#2b2766}.st.reviewing{background:#3a2c7a;color:#d6ceff}.st.need_info{background:rgba(255,210,63,.18);color:var(--warn)}.st.in_quote{background:rgba(79,240,176,.15);color:var(--ok)}.st.later{background:#222;color:var(--mute)}
/* quote */
.doc{position:relative;background:#f7f5ff;color:#15122f;border-radius:6px;padding:clamp(20px,5vw,56px);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.doc .wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:2}
.doc .wm span{font:900 clamp(5rem,18vw,15rem)/1 var(--fb);color:rgba(255,46,77,.13);transform:rotate(-24deg);letter-spacing:.05em;border:.06em solid rgba(255,46,77,.13);padding:0 .15em}
.doc h2{font:900 clamp(1.6rem,3.6vw,2.6rem)/1.1 var(--fs);letter-spacing:-.03em;margin:0}
.doc .meta{display:flex;gap:18px;flex-wrap:wrap;font:500 .8rem var(--fm);color:#5a5680;margin:10px 0 24px}
.doc section{display:grid;grid-template-columns:190px 1fr;gap:18px;padding:16px 0;border-top:1px solid #dcd8f0}
.doc section h4{margin:0;font-size:.9rem;color:#6a2a8f}
.doc section h4 i{font:700 .7rem var(--fm);color:#a39fc3;font-style:normal;display:block}
.doc .tbl th,.doc .tbl td{border-color:#dcd8f0}.doc .tbl th{color:#6c6890}
.doc ul{margin:0;padding-left:18px}
.doc .tot{background:#15122f;color:#fff;border-radius:10px;padding:16px 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.doc .tot small{display:block;color:#a19dd0;font-size:.75rem}.doc .tot b{font:700 1.2rem var(--fm)}
.doc .samp{background:#ffe3e8;color:#b0102c;padding:10px 14px;border-radius:8px;font-weight:700;font-size:.875rem;margin-bottom:14px;position:relative;z-index:3}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opts div{border:1px solid #dcd8f0;border-radius:10px;padding:12px;font-size:.85rem}
.opts div.on{border:2px solid #6a2a8f}
.opts b{font:800 1.4rem var(--fb)}
/* confirm */
.cf h2{font:900 clamp(2.2rem,6vw,4.8rem)/1.02 var(--fs);letter-spacing:-.045em;margin:0 0 20px}
.cf h2 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cfrow{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--rule)}
.cfrow>b{color:var(--sig)}
/* pay */
.paysum{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:0;border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.paysum>div{padding:22px;border-right:1px solid var(--rule)}.paysum>div:last-child{border:0}
.paysum .today{background:linear-gradient(140deg,rgba(255,92,207,.2),rgba(122,107,255,.15))}
.paysum small{display:block;color:var(--mute);font-size:.8rem}
.paysum .amt{font:800 clamp(1.6rem,3vw,2.4rem)/1.1 var(--fm);margin:6px 0}
.pstate{display:flex;gap:14px;align-items:center;padding:18px;border-radius:14px;border:1px solid var(--rule);margin:18px 0}
.pstate .dot{width:14px;height:14px;border-radius:50%;flex:none}

  return `<li class="${c}${p}">${fence}${S.demo?`<button type="button" data-jump="${n}" title="DEMO: ${n}단계로 이동" ${n===st?'aria-current="step"':""}>${inner}</button>`:`<span class="s" ${n===st?'aria-current="step"':""}>${inner}</span>`}</li>`}).join("");

function recos(l,items){
 const has=k=>items.some(x=>x.kind===k),out=[],i=l.intake||{};
 const br=+(i.branches||0)>1||/2~|6~|21/.test(String(l.plan?.stores||l.answers?.stores||""))||/프랜차이즈/.test(String(l.industry||""));
 if(has("integration")&&!has("migration"))out.push(["migration","기존 데이터 이관 범위","외부 도구를 연결하시면, 기존 데이터를 어디까지 옮길지 함께 정해야 연결 후 숫자가 맞습니다."]);
 if(br&&!has("permission"))out.push(["permission","지점별 권한 · 본사 승인","지점(사업장)이 여러 곳이라 지점별 입력 권한과 본사 승인 단계를 함께 추천합니다."]);
 if(has("add_task")&&!has("rule"))out.push(["rule","승인·알림 기준","업무를 추가하시면 누가 승인하고 언제 알림이 가는지 정해야 AI가 처리 범위를 압니다."]);
 const unkL=A(l.plan?.toConfirm).filter(x=>x.src==="unknown").map(x=>x.label);const unk=unkL.length?unkL:A(i.unknown);if(unk.length&&!has("explain"))out.push(["explain","아직 모르는 조건 설명","‘아직 모르겠어요’로 남긴 "+unk.slice(0,2).join("·")+" 항목은 상담 때 같이 정하면 견적이 정확해집니다."]);
 A(l.plan?.flows).forEach(x=>{const names=A(l.plan.flows).map(y=>y.name);if(x.pair&&!names.includes(x.pair)&&!items.some(it=>it.text.includes(x.pair))&&!out.some(o=>o[1]===x.pair))out.push(["add_task",x.pair,`선택하신 ‘${x.name}’과 이어집니다 — ${x.pairWhy||"데이터가 이어져 함께 만들면 수작업이 줄어듭니다"}`,x.pair+" 업무도 함께 연결하고 싶어요"])});
 A(l.plan?.flows).filter(x=>/^(x|확장)/.test(x.group)).forEach(x=>out.push(["schedule",x.name+" 시점",`‘${x.name}’은 추후 확장으로 잡았습니다 — 1차 오픈에 넣을지, 기본 흐름이 자리 잡은 뒤 붙일지 정해주세요.`,x.name+" 업무를 1차 오픈에 포함할지 상담 원해요"]));
 if(!has("change_screen"))out.push(["change_screen","가장 자주 볼 화면","시안에서 매일 열 화면부터 다듬으면 직원 적응이 빨라집니다."]);
 return out.slice(0,4);
}
