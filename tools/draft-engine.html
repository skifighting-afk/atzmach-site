<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1차 시안</title>
<style>
:root{
  --bg:#F5F5F2;--surf:#FFFFFF;--surf2:#EBEBE6;--ink:#171717;--ink2:#4D4D4A;--ink3:#83837E;--line:#DEDED8;
  --acc:#1F5C4A;--acc-ink:#FFFFFF;--acc-tx:#1F5C4A;--acc2:#B8862B;
  --pos:#1E7F55;--warn:#A86A12;--crit:#BE3427;
  --fd:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  --fb:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  --fdw:700;--r:8px;--r2:12px;
  --soft:color-mix(in srgb,var(--acc) 9%,var(--surf));
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.12);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--fb);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc-tx)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ic{width:16px;height:16px;flex:none;vertical-align:-3px}
.c-pos{color:var(--pos)}.c-warn{color:var(--warn)}.c-crit{color:var(--crit)}.c-acc{color:var(--acc-tx)}.c-2{color:var(--ink2)}.c-3{color:var(--ink3)}
.disp{font-family:var(--fd);font-weight:var(--fdw);letter-spacing:-.015em}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* top badge */
.strip{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:7px 20px;font-size:12.5px;background:var(--ink);color:color-mix(in srgb,var(--bg) 82%,transparent)}
.strip b{font-weight:600;color:var(--bg)}
.strip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc2);margin-right:8px;vertical-align:1px;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.strip .r{opacity:.8;white-space:nowrap}

/* shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:calc(100vh - 34px)}
.side{border-right:1px solid var(--line);background:var(--surf);padding:20px 14px 40px;position:sticky;top:34px;height:calc(100vh - 34px);overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px}
.brand .nm{font-family:var(--fd);font-weight:var(--fdw);font-size:17px;letter-spacing:-.01em;line-height:1.2}
.brand .co{font-size:12px;color:var(--ink3)}
.mark{flex:none;width:36px;height:36px;border-radius:calc(var(--r) + 2px);background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-family:var(--fd);font-weight:var(--fdw);font-size:16px;line-height:1;box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--acc2) 70%,transparent)}
.navh{font-size:12px;color:var(--ink3);padding:16px 10px 6px;display:flex;justify-content:space-between}
.nav button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);color:var(--ink2);font-size:14.5px;cursor:pointer}
.nav button:hover{background:var(--surf2)}
.nav button:focus-visible{outline:2px solid var(--acc)}
.nav button.on{background:color-mix(in srgb,var(--acc) 12%,var(--surf));color:var(--ink);font-weight:600}
.nav .ic{width:16px;height:16px;flex:none;opacity:.85}
.nav .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .lk{color:var(--ink3)}
.nav .bdg{font-size:11px;font-weight:700;color:var(--acc-ink);background:var(--acc);border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center}
.nav .ok{width:16px;height:16px;border-radius:50%;background:var(--pos);display:grid;place-items:center}
.nav .lki{width:12px;height:12px;opacity:.6;flex:none}
.sidefoot{margin:22px 10px 0;font-size:12px;color:var(--ink3);line-height:1.55}

.main{min-width:0;padding:28px 36px 120px}
.mnav{display:none}
.crumb{font-size:13px;color:var(--ink3);margin-bottom:18px;display:flex;justify-content:space-between;gap:12px}
h1.hello{font-family:var(--fd);font-weight:var(--fdw);font-size:31px;line-height:1.25;letter-spacing:-.02em;margin:0 0 8px}
.lede{color:var(--ink2);margin:0 0 22px;font-size:16px;max-width:820px}
.lede b{color:var(--ink);font-weight:600}
h2.sec{font-family:var(--fd);font-weight:var(--fdw);font-size:19px;letter-spacing:-.01em;margin:0 0 12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2.sec .ct{font-family:var(--fb);font-size:13.5px;color:var(--ink3);font-weight:500;letter-spacing:0}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:var(--r2)}
.view{display:none}
.view.on{display:block;animation:vin .35s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.blk{margin-top:34px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r);padding:9px 15px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surf);color:var(--ink);text-decoration:none;white-space:nowrap;transition:filter .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--ink3)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.lg{padding:12px 20px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--surf2);color:var(--ink2);white-space:nowrap;font-weight:500}
.tag.acc{background:color-mix(in srgb,var(--acc) 14%,var(--surf));color:var(--acc-tx)}
.tag.crit{background:color-mix(in srgb,var(--crit) 12%,var(--surf));color:var(--crit)}
.tag.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surf));color:var(--warn)}
.tag.pos{background:color-mix(in srgb,var(--pos) 13%,var(--surf));color:var(--pos)}
.ent{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--ink2);background:var(--surf);white-space:nowrap}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end;margin-bottom:22px}
.goals{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.goals span{font-size:13px;padding:4px 11px;border-radius:999px;background:var(--surf);border:1px solid var(--line);color:var(--ink2)}
.goals span b{color:var(--acc-tx);margin-right:4px}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.col{padding:16px 18px 8px}
.col h3{margin:0 0 4px;font-size:14.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.col h3 .n{font-family:var(--fd);font-size:22px;font-weight:var(--fdw)}
.col .it{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px;align-items:start}
.col .it:first-of-type{border-top:0}
.col .it .t{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;padding-top:1px}
.col .it .x{color:var(--ink2)}
.col .it .x b{color:var(--ink);font-weight:600;display:block}
.col .it button{margin-top:8px}
.dot2{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--warn)}
.dot2.ok{background:var(--pos)}
.dot2.ac{background:var(--acc)}
.fx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.fcard{padding:20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.fcard .no .ic{width:20px;height:20px}
.fcard .no{font-family:var(--fd);font-size:13px;color:var(--acc-tx);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.fcard h3{margin:0;font-family:var(--fd);font-weight:var(--fdw);font-size:19px;letter-spacing:-.01em;line-height:1.3}
.fcard .ba{display:grid;grid-template-columns:44px 1fr;gap:6px 10px;font-size:13.5px}
.fcard .ba dt{color:var(--ink3);margin:0}
.fcard .ba dd{margin:0;color:var(--ink2)}
.fcard .ba dd.a{color:var(--ink);font-weight:500}
.fcard .go{margin-top:auto}
.fcard.done::after{content:"체험 완료";position:absolute;top:16px;right:-30px;transform:rotate(35deg);background:var(--pos);color:#fff;font-size:11px;font-weight:700;padding:3px 34px}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.notes{padding:6px 20px}
.notes li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink2)}
.notes li:last-child{border:0}
.notes ul{list-style:none;margin:0;padding:0}
.src{padding:14px 20px;font-size:13px}
.src a{display:block;padding:7px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink2)}
.src a:last-child{border:0}
.src a span{color:var(--ink3);font-size:12px;margin-left:6px}
.src a:hover b{text-decoration:underline}
.src a b{font-weight:500;color:var(--acc-tx)}
.mt{width:100%;border-collapse:collapse;font-size:13.5px}
.mt th{text-align:left;font-weight:500;color:var(--ink3);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.mt td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.mt tr:last-child td{border-bottom:0}
.mt .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.lst{list-style:none;margin:0;padding:0}
.lst li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink2)}
.lst li:last-child{border:0}
.lst li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--ink3);margin-top:8px}
.lockrow{display:flex;gap:10px;flex-wrap:wrap}
.lockrow button{display:flex;gap:8px;align-items:center;padding:10px 14px;border:1px dashed var(--line);background:var(--surf);border-radius:var(--r);color:var(--ink2);font-size:14px}
.lockrow button:hover{border-color:var(--ink3)}

/* feature view */
.fhead{margin-bottom:18px}
.eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink3);margin-bottom:8px}
.eyebrow .live{color:var(--pos);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.eyebrow .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pos);animation:pulse 2s infinite}
.fhead h1{font-family:var(--fd);font-weight:var(--fdw);font-size:28px;letter-spacing:-.02em;margin:0 0 6px;line-height:1.3}
.insight{font-size:16px;color:var(--ink2);max-width:820px;margin:0}
.nowrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-bottom:18px;overflow:hidden}
.nowrow>div{padding:14px 18px;border-left:1px solid var(--line);font-size:14px;color:var(--ink2)}
.nowrow>div:first-child{border-left:0}
.nowrow .k{font-size:12px;font-weight:700;color:var(--ink3);margin-bottom:3px;letter-spacing:.02em}
.nowrow .aft{background:var(--soft);color:var(--ink)}
.nowrow .aft .k{color:var(--acc-tx)}
.flow{list-style:none;margin:0 0 16px;padding:14px 16px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;counter-reset:s}
.flow li{position:relative;padding:0 10px 0 0;min-width:0}
.flow .nd{display:flex;align-items:center;gap:8px}
.flow .c{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--surf);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink3);transition:all .35s;position:relative;z-index:1}
.flow .ln{flex:1;height:2px;background:var(--line);border-radius:1px;position:relative;overflow:hidden}
.flow .ln i{position:absolute;inset:0;background:var(--pos);transform:scaleX(0);transform-origin:left;transition:transform .5s ease}
.flow li:last-child .ln{display:none}
.flow .t{font-size:13px;font-weight:700;color:var(--ink3);margin-top:8px;transition:color .3s}
.flow .x{font-size:12.5px;color:var(--ink3);line-height:1.4;margin-top:2px;padding-right:8px}
.flow li.run .c{border-color:var(--acc);color:var(--acc-tx);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.flow li.run .t{color:var(--ink)}
.flow li.run .x{color:var(--ink2)}
.flow li.ok .c{background:var(--pos);border-color:var(--pos);color:#fff}
.flow li.ok .t{color:var(--ink)}
.flow li.ok .ln i{transform:none}
.simgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.sim{overflow:hidden;box-shadow:var(--shadow)}
.simh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.simh .ti{display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px;min-width:0;flex-wrap:wrap}
.phase{font-size:12.5px;font-weight:600;color:var(--acc-tx);display:inline-flex;align-items:center;gap:6px}
.phase::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.simb{padding:16px 18px;min-height:240px}
.simf{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surf2) 45%,var(--surf))}
.simf .hint{margin-right:auto;font-size:13px;color:var(--ink3)}
.aside{display:flex;flex-direction:column;gap:12px}
.aside .panel{padding:14px 16px;font-size:13.5px;color:var(--ink2)}
.aside h4{margin:0 0 6px;font-size:12.5px;color:var(--ink3);font-weight:700;display:flex;gap:6px;align-items:center}
.aside .ai h4{color:var(--acc-tx)}
.aside .ent-card b{display:block;color:var(--ink);font-size:14.5px;margin-top:4px}

/* sim parts */
.ctxbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.fac{display:flex;flex-direction:column;gap:5px;min-width:0}
.fac label{font-size:12px;color:var(--ink3);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surf2)}
.seg button{border:0;background:none;padding:6px 11px;font-size:13px;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.seg[aria-disabled=true]{opacity:.55;pointer-events:none}
.fac small{font-size:11.5px;color:var(--ink3)}
.bar{height:6px;border-radius:3px;background:var(--surf2);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:3px;transition:width .7s cubic-bezier(.2,.7,.2,1)}
.bar i.u{background:var(--ink3);opacity:.45}
.cmp{display:grid;gap:3px;min-width:110px}
.ai-col{transition:opacity .4s}
.pending .ai-col{opacity:.25}
.flash{animation:fl 1.2s ease}
@keyframes fl{0%{background:color-mix(in srgb,var(--acc) 22%,transparent)}100%{background:transparent}}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 0}
.kpi{padding:12px 14px;border-radius:var(--r);background:var(--surf2)}
.kpi .l{font-size:12px;color:var(--ink3)}
.kpi .v{font-family:var(--fd);font-weight:var(--fdw);font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .s{font-size:12px;color:var(--ink2)}
.kpi.good{background:color-mix(in srgb,var(--pos) 10%,var(--surf))}
.kpi.bad{background:color-mix(in srgb,var(--crit) 9%,var(--surf))}
.doc{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);padding:18px 20px;box-shadow:0 10px 30px -18px rgba(0,0,0,.25)}
.doc .dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:10px;flex-wrap:wrap}
.doc .dh b{font-family:var(--fd);font-weight:var(--fdw);font-size:18px}
.doc .dh span{font-size:12px;color:var(--ink3)}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.log{list-style:none;margin:0;padding:0;font-size:14px}
.log li{display:grid;grid-template-columns:52px 22px minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;animation:vin .3s ease}
.log li:last-child{border:0}
.log .tm{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.log .s{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--acc);border-top-color:transparent;animation:spin .8s linear infinite}
.log li.ok .s{animation:none;background:var(--pos);border-color:var(--pos);display:grid;place-items:center}
.log li.ok .s::after{content:"";width:7px;height:3.5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.log li.al .s{animation:none;background:var(--warn);border-color:var(--warn)}
.log .d{color:var(--ink2)}
.log .d b{color:var(--ink);font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
.oc h4{font-family:var(--fd);font-weight:var(--fdw);font-size:23px;margin:8px 0 4px;letter-spacing:-.015em}
.diff{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.diff th{font-weight:500;color:var(--ink3);font-size:12.5px;text-align:right;padding:6px 0;border-bottom:1px solid var(--line)}
.diff th:first-child{text-align:left}
.diff td{padding:11px 0 11px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.diff td:first-child{text-align:left;color:var(--ink2);padding-left:0}
.diff td.b{color:var(--ink3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink3) 60%,transparent)}
.diff td.a{font-weight:700;color:var(--pos)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.bub{background:var(--surf);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:11px 13px;font-size:13.5px;line-height:1.6;white-space:pre-line;max-width:420px}
.kakao{background:color-mix(in srgb,#FEE500 16%,var(--surf2));border-radius:var(--r);padding:12px}
.kakao .who{font-size:12px;color:var(--ink3);margin-bottom:6px}
.typing::after{content:"▍";animation:pulse 1s infinite;color:var(--acc)}
.empty{padding:28px;text-align:center;color:var(--ink3);font-size:14px}

/* approval */
.qgrp{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.qgrp .g{flex:1;min-width:140px;padding:10px 12px;border-radius:var(--r);background:var(--surf2)}
.qgrp .g .l{font-size:12.5px;color:var(--ink2);display:flex;justify-content:space-between}
.qgrp .g .l b{font-variant-numeric:tabular-nums;color:var(--ink)}
.qgrp .g .bar{margin-top:6px}
.qi{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;transition:opacity .3s,border-color .3s;background:var(--surf)}
.qi .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink3)}
.qi .top b{color:var(--ink);font-size:13.5px}
.qi .tx{font-size:14px;margin:6px 0 0;color:var(--ink)}

/* schedule */
.wk{display:grid;gap:3px;min-width:640px}
.wk .h{font-size:12px;color:var(--ink3);text-align:center;padding:4px 0;font-weight:600}

.sh.gap{background:none;border:1.5px dashed var(--crit);color:var(--crit);font-weight:700;animation:pulse 1.6s infinite}
.sh.new{background:var(--pos);color:#fff;font-weight:700;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:none}}
.chk td.c{text-align:center;font-weight:700;width:58px}
.chk .y{color:var(--pos)}.chk .n{color:var(--crit)}

.chk tr td{transition:opacity .3s,background .3s}
.req{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--crit) 35%,var(--line));background:color-mix(in srgb,var(--crit) 5%,var(--surf));margin-bottom:14px;font-size:14px;flex-wrap:wrap}

/* booking */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.slot .tt{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.slot .tt span{font-size:12px;color:var(--ink3);font-weight:500}
.bk{display:flex;justify-content:space-between;gap:6px;font-size:13px;padding:5px 0;border-top:1px dashed var(--line);align-items:center}
.bk:first-of-type{border-top:0}
.bk.risk{color:var(--crit)}
.bk.rel{text-decoration:line-through;color:var(--ink3)}
.bk.fill{color:var(--pos);font-weight:600}
.bk.free{color:var(--ink3);font-style:italic}

/* pipeline */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px}
.kcol{background:var(--surf2);border-radius:var(--r);padding:10px;min-height:200px}
.kcol h5{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between;color:var(--ink2)}

.kc .m{display:flex;justify-content:space-between;color:var(--ink3);font-size:12px;margin-top:4px;gap:6px}

/* settlement */
.rec{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);gap:0;font-size:13px}

.rec .rw.m{background:color-mix(in srgb,var(--pos) 7%,transparent)}

/* report */
.rpt{max-width:640px;margin:0 auto}
.rpt .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}

/* dispatch */

.rule{display:grid;grid-template-columns:auto minmax(0,1fr) 170px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}

.lockcard .lc{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--ink);color:var(--bg)}

/* quote */
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}

.qlabel{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:4px;border:1.5px solid var(--acc);color:var(--acc-tx);margin-bottom:6px}
.qlabel.final{background:var(--acc);color:var(--acc-ink)}
.qtitle{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:22px 0 6px;flex-wrap:wrap}
.qtitle h2{font-family:var(--fd);font-weight:var(--fdw);font-size:26px;margin:0;letter-spacing:-.02em}
.qtot{text-align:right}
.qtot .l{font-size:12.5px;color:var(--ink3)}
.qtot .v{font-family:var(--fd);font-weight:var(--fdw);font-size:32px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.qmeta{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);margin-bottom:6px}

.qsec{margin-top:28px}

.qt{width:100%;border-collapse:collapse;font-size:14px}
.qt th{font-size:12px;font-weight:600;color:var(--ink3);text-align:left;padding:8px 8px;border-bottom:1px solid var(--ink3);white-space:nowrap}
.qt td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.qt .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.payline{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.payline .pc .s{font-size:12.5px;color:var(--ink2)}
.paybar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:10px;gap:2px}

.inc .n li::before{content:"–";color:var(--ink3)}
.qnote{font-size:13px;color:var(--ink3);margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
.qsim{position:sticky;top:54px;padding:18px}
.qsim h3{margin:0;font-size:16px;font-weight:700}
.qsim .warnline{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:1px 7px;margin:6px 0 12px}
.tg{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.tg input{width:17px;height:17px;accent-color:var(--acc);flex:none}
.tg .p{margin-left:auto;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sl{display:grid;grid-template-columns:70px 1fr 54px;gap:10px;align-items:center;padding:10px 0}
.sl label{font-size:13.5px;color:var(--ink2)}

/* consult */
.cwrap{max-width:780px}
.cwrap textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);padding:14px 16px;font-size:15px;resize:vertical}

.cta{position:fixed;right:22px;bottom:20px;z-index:50;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;box-shadow:0 14px 40px rgba(0,0,0,.25);border:0}

.cta.hide{display:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:14px;opacity:0;transition:.25s;z-index:80;max-width:calc(100% - 32px);pointer-events:none}

/* ---------- SIM: approval ---------- */
SIMS.approval=A=>{

  const stars=r=>r?`<span class="stars" aria-label="별점 ${r}">${'★'.repeat(r)}${'☆'.repeat(5-r)}</span>`:'';

    <p class="tx">${esc(x.text)}</p>${x.st==='new'?'':`<div class="dr"><span class="lb">AI 초안${x.ed?' · 수정됨':''}</span><span class="dt">${x.st==='typing'?'':esc(x.draft)}</span></div>`}
    ${x.st==='draft'&&!busy?`<div class="ac"><button class="btn sm ghost" data-a="hold">보류</button><button class="btn sm" data-a="edit">수정</button><button class="btn sm pri" data-a="ok">승인</button></div>`:''}</div>`;
  const list=()=>`<div class="qlist">${items.map(card).join('')}</div>`;
  const grp=(fill)=>`<div class="qgrp">${groups.map(g=>`<div class="g"><div class="l"><span>${esc(g.label)}${g.auto?' <span class="tag acc">규칙대로 자동</span>':''}</span><b>${fill?g.n:'–'}건</b></div><div class="bar"><i style="width:${fill?g.n/total*100:0}%"></i></div></div>`).join('')}</div>`;
  A.body.innerHTML=`<div class="sumrow" style="margin:0 0 14px">${kpi('새로 들어온 건',fmt(total)+'건','밤사이 · 처리 전')}${kpi('답 안 된 건',fmt(total)+'건','','bad')}</div>${grp(0)}${list()}`;
  A.foot2(`${total}건이 쌓여 있습니다`,[{l:'AI 초안 만들기',pri:1,fn:draft}]);
  async function draft(){
    A.stage('AI 처리');busy=true;A.foot2('분류하고 초안을 쓰는 중…',[]);
    $('.qgrp',A.body).outerHTML=grp(1);
    for(let k=0;k<items.length;k++){items[k].st='typing';rerender();const el=$(`[data-i="${k}"] .dt`,A.body);el.classList.add('typing');
      const t=items[k].draft||'';for(let c=0;c<=t.length;c+=Math.max(2,Math.ceil(t.length/14))){el.textContent=t.slice(0,c);await wait(22)}
      items[k].st='draft';}
    busy=false;rerender();A.stage('사람 승인');approveFoot();
  }
  function rerender(){$('.qlist',A.body).outerHTML=list();bind()}
  function bind(){$$('.qi',A.body).forEach(q=>{const k=+q.dataset.i;$$('[data-a]',q).forEach(b=>b.onclick=()=>{const a=b.dataset.a,x=items[k];
    if(a==='edit'){const dr=$('.dr',q);dr.outerHTML=`<textarea aria-label="답글 수정">${esc(x.draft)}</textarea>`;b.textContent='수정 완료';b.dataset.a='save';b.onclick=()=>{x.draft=$('textarea',q).value;x.ed=1;rerender();approveFoot()};return}
    x.st=a==='ok'?'ok':'hold';rerender();approveFoot()})})}
  function approveFoot(){
    const left=items.filter(x=>x.st==='draft'),safe=left.filter(x=>!x.flag),ok=items.filter(x=>x.st==='ok').length;
    if(!left.length)return A.foot2(`확인 끝 · 승인 ${ok}건${autoN?` + 자동 ${autoN}건`:''}`,[{l:'승인한 답글 게시',pri:1,fn:exec}]);

  }
  async function exec(){

    A.body.innerHTML=`<p style="margin:0 0 6px;font-weight:600">승인하셨습니다. 게시하고 있습니다 <span class="tag">시뮬레이션</span></p>`;
    const by={};[...ok].forEach(x=>{const m=(x.meta||'기본').split('·')[0].trim();by[m]=(by[m]||0)+1});
    await A.log([...(autoN?[{h:`규칙대로 자동 처리 <b>${autoN}건</b> 게시`}]:[]),...Object.entries(by).map(([m,n])=>({h:`${esc(m)} · 확인한 답글 <b>${n}건</b> 게시`})),...(hold.length?[{h:`보류 ${hold.length}건은 ${BOSS} 확인함에 남김`,al:1}]:[]),{h:`처리 기록 저장`}]);
    await wait(300);A.stage('결과');
    A.outcome({h:`${total-hold.length}건 처리 · 남은 건 ${hold.length}건`,s:`직접 확인한 건 ${ok.length}건${autoN?`, 규칙대로 자동 ${autoN}건`:''}`,rows:[['처리 안 된 건',`${total}건`,`${hold.length}건`],['직접 확인한 건','0건',`${ok.length}건 / ${items.length}건`],...extraK(d)]});
  }
};

/* ---------- SIM: schedule ---------- */
SIMS.schedule=A=>{
  const d=A.data,days=d.days||['월','화','수','목','금','토','일'],P=d.people||[],SH=(d.shifts||[]).map(s=>({...s})),O=d.open||{};
  const hrs=n=>SH.filter(s=>s.w===n&&!(s===openS)).reduce((a,s)=>a+(s.e-s.s),0);
  const openS=SH.find(s=>s.d===O.d&&s.s===O.s&&s.w===O.w)||(SH.push({...O}),SH[SH.length-1]);
  const len=O.e-O.s,GS=+d.groupSize||P.length,H2=h=>String(h).padStart(2,'0')+':00';
  const checks=p=>{const mine=SH.filter(s=>s.w===p.name&&s!==openS);
    const prev=mine.filter(s=>s.d===O.d-1).map(s=>24-s.e+O.s),next=mine.filter(s=>s.d===O.d+1).map(s=>24-O.e+s.s),same=mine.filter(s=>s.d===O.d);
    const rest=Math.min(99,...prev,...next);
    return [['가능 시간',(p.days||[0,1,2,3,4,5,6]).includes(O.d)&&(p.from??0)<=O.s&&(p.to??24)>=O.e],
     ['겹침 없음',!same.some(s=>s.s<O.e&&s.e>O.s)],['휴식 11시간',rest>=11],['주간 한도',hrs(p.name)+len<=(p.maxHours??52)],['필요 숙련',!O.k||(p.skills||[]).includes(O.k)]]};
  const cand=P.filter(p=>p.name!==O.w).map(p=>({p,c:checks(p),h:hrs(p.name)})).map(x=>({...x,ok:x.c.every(c=>c[1])}));
  const el=cand.filter(x=>x.ok).sort((a,b)=>a.h-b.h);
  let pickN=null;
  const grid=()=>`<div class="tscroll"><div class="wk" style="grid-template-columns:86px repeat(${days.length},minmax(72px,1fr))"><span></span>${days.map(x=>`<span class="h">${esc(x)}</span>`).join('')}
    ${P.map(p=>`<span class="p">${esc(p.name)}<small>${esc(p.role||'')} · ${hrs(p.name)+(pickN===p.name?len:0)}h</small></span>`+days.map((_,di)=>`<span class="cell">${SH.filter(s=>s.d===di&&(s.w===p.name&&s!==openS||(s===openS&&(p.name===O.w&&!pickN||p.name===pickN)))).map(s=>s===openS?(pickN?`<span class="sh new">${s.s}–${s.e} ${esc(s.k||'')}</span>`:`<span class="sh gap">공석 ${s.s}–${s.e}</span>`):`<span class="sh ${s.k?'o':''}">${s.s}–${s.e}${s.k?' '+esc(s.k):''}</span>`).join('')}</span>`).join('')).join('')}</div></div>`;
  A.body.innerHTML=`<div class="req"><span class="tag crit">결근 신청</span><span><b>${esc(O.w||'')}</b> · ${esc(days[O.d]||'')} ${H2(O.s)}–${H2(O.e)} ${esc(O.k||'')} 근무 · ${esc(O.reason||'')}</span></div><div id="sg">${grid()}</div>`;
  A.foot2(`지금은 단체방에 올리고 답을 기다리는 방식`,[{l:'AI 대타 찾기',pri:1,fn:find}]);
  async function find(){
    A.stage('AI 처리');
    A.body.innerHTML=`<div class="req"><span class="tag crit">공석</span><span><b>${esc(days[O.d]||'')} ${H2(O.s)}–${H2(O.e)} ${esc(O.k||'')}</b> · ${cand.length}명을 근무 규칙 5가지로 확인합니다</span></div>
     <div class="tscroll"><table class="mt chk"><thead><tr><th>${STAFF}</th>${cand[0]?cand[0].c.map(c=>`<th style="text-align:center">${c[0]}</th>`).join(''):''}<th class="r">이번 주</th></tr></thead><tbody>${cand.map((x,k)=>`<tr class="hide" data-r="${k}"><td><b>${esc(x.p.name)}</b></td>${x.c.map(c=>`<td class="c ${c[1]?'y':'n'}">${c[1]?'✓':'✕'}</td>`).join('')}<td class="r">${x.h}h / ${x.p.maxHours??'-'}h</td></tr>`).join('')}</tbody></table></div>
     <div class="sumrow">${kpi('확인한 사람',cand.length+'명')}${kpi('조건 맞는 사람',`<span id="eN">0</span>명`,'이 사람들에게만 알림','good')}${kpi('규칙 위반 위험','0건','자동으로 걸러냄')}</div>`;
    for(let k=0;k<cand.length;k++){await wait(260);const r=$(`[data-r="${k}"]`,A.body);r.classList.remove('hide');if(cand[k].ok){r.classList.add('el');$('#eN',A.body).textContent=cand.slice(0,k+1).filter(x=>x.ok).length}}
    await wait(300);A.stage('사람 승인');
    if(!el.length){A.foot2('조건 맞는 사람이 없습니다',[{l:`${BOSS}께 전화 알림`,pri:1,fn:()=>A.outcome({h:'조건 맞는 대타 없음 → 바로 알림',s:'규칙을 어기는 배정은 하지 않습니다',rows:[['확인한 사람','0명',cand.length+'명']]})}]);return}

  }
  async function exec(){
    A.stage('실행');const w=el[0],rs=+d.respSec||38;

    pickN=w.p.name;await wait(300);A.stage('결과');

  }
};

/* ---------- SIM: inventory ---------- */
SIMS.inventory=A=>{
  const d=A.data,fac=(d.factors||[]).map(x=>({...x,sel:x.sel??0})),items=d.items||[];
  const mult=it=>fac.reduce((m,x)=>{const o=x.options[x.sel]||{m:1};const s=(it.sens&&it.sens[x.key])??1;return m*(1+(o.m-1)*s)},1);
  const calc=()=>items.map(it=>{const st=+it.stock||0,pk=+it.pack||1,fc=Math.round(it.base*mult(it)),sug=Math.ceil(Math.max(0,fc-st)/pk)*pk,us=it.usual??it.base,prod=it.kind!=='발주';
    return {...it,st,fc,sug,us,prod,wB:prod?Math.max(0,us+st-fc):0,wA:prod?Math.max(0,sug+st-fc):0,sB:Math.max(0,fc-us-st),sA:Math.max(0,fc-sug-st)}});
  let ran=false;
  const tot=r=>{const S=(k)=>r.reduce((a,x)=>a+x[k],0);return{wB:S('wB'),wA:S('wA'),sB:S('sB'),sA:S('sA'),wcB:r.reduce((a,x)=>a+x.wB*(x.cost||0),0),wcA:r.reduce((a,x)=>a+x.wA*(x.cost||0),0),
    pB:r.filter(x=>!x.prod).reduce((a,x)=>a+x.us*(x.price||0),0),pA:r.filter(x=>!x.prod).reduce((a,x)=>a+x.sug*(x.price||0),0)}};
  const facs=()=>`<div class="ctxbar">${fac.map((x,fi)=>`<div class="fac"><label>${esc(x.label)}</label><div class="seg" role="radiogroup" aria-label="${esc(x.label)}" aria-disabled="${!ran}">${x.options.map((o,oi)=>`<button type="button" role="radio" aria-checked="${oi===x.sel}" class="${oi===x.sel?'on':''}" data-f="${fi}" data-o="${oi}">${esc(o.l)}</button>`).join('')}</div>${x.src?`<small>${esc(x.src)}</small>`:''}</div>`).join('')}</div>`;
  const table=r=>{const mx=Math.max(...r.map(x=>Math.max(x.us,x.fc,x.sug+x.st)),1);return `<div class="tscroll ${ran?'':'pending'}"><table class="mt inv"><thead><tr><th>품목</th><th class="r">평소</th><th class="r ai-col">AI 예측</th><th class="r">재고</th><th class="r ai-col">AI 제안</th><th class="ai-col bars" style="min-width:120px">평소 vs 제안</th></tr></thead><tbody>
   ${r.map(x=>`<tr><td><b>${esc(x.name)}</b> <span class="tag">${esc(x.kind||'생산')}</span></td><td class="r">${fmt(x.us)}${esc(x.unit||'')}</td><td class="r ai-col"><b>${ran?fmt(x.fc):'–'}</b></td><td class="r">${fmt(x.st)}</td><td class="r ai-col"><b class="c-acc">${ran?fmt(x.sug):'–'}</b></td>
    <td class="ai-col bars"><div class="cmp"><div class="bar"><i class="u" style="width:${x.us/mx*100}%"></i></div><div class="bar"><i style="width:${ran?(x.sug+x.st)/mx*100:0}%"></i></div></div></td></tr>`).join('')}</tbody></table></div>`};
  const sums=r=>{const t=tot(r);return `<div class="sumrow">${kpi('예상 폐기',`${fmt(t.wB)} → <span class="c-pos">${fmt(t.wA)}</span>`,`원가 ${man(t.wcB)} → ${man(t.wcA)}`,'good')}${kpi('예상 품절',`${fmt(t.sB)} → <span class="c-pos">${fmt(t.sA)}</span>`,'개수 기준')}${t.pB?kpi('원료 발주액',`${man(t.pA)}`,`평소 ${man(t.pB)}`):''}</div>`};
  const draw=()=>{const r=calc();A.body.innerHTML=`<div class="c-3" style="font-size:13px;margin-bottom:10px">${esc(d.date||'')} 기준 · 조건을 바꾸면 수량이 바로 다시 계산됩니다</div>${facs()}<div id="it">${table(r)}</div>${ran?sums(r):''}`;
    $$('[data-f]',A.body).forEach(b=>b.onclick=()=>{fac[+b.dataset.f].sel=+b.dataset.o;draw();$('#it',A.body).classList.add('flash')})};
  draw();
  A.foot2('평소에는 전날 밤 감으로 정하던 수량',[{l:'AI 예측 실행',pri:1,fn:async()=>{A.stage('AI 처리');A.foot2('판매 기록 · 날씨 · 요일을 맞춰 보는 중…',[]);await wait(700);ran=true;draw();await wait(500);A.stage('사람 승인');
    A.foot2('조건을 바꿔 보셔도 됩니다',[{l:'수량 확인 · 지시서 보기',pri:1,fn:preview}])}}]);
  function preview(){
    const r=calc(),pr=r.filter(x=>x.prod&&x.sug),po=r.filter(x=>!x.prod&&x.sug),poT=po.reduce((a,x)=>a+x.sug*(x.price||0),0);

/* ---------- SIM: dispatch ---------- */
SIMS.dispatch=A=>{
  const d=A.data,dep=d.depot||{name:'출발지',x:50,y:50},V=d.vehicles||[{name:'1호차',cap:99}],J=d.jobs||[],SPD=d.kmh||30,STOP=d.stopMin||10,ST=String(d.start||'09:00').split(':').reduce((a,v,i)=>a+(i?+v:v*60),0);
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y)*(d.kmPerUnit||.1);
  const routeLen=r=>r.reduce((a,j,k)=>a+dist(k?r[k-1]:dep,j),0)+(r.length?dist(r[r.length-1],dep):0);
  const eta=r=>{let t=ST,cur=dep;return r.map(j=>{t+=dist(cur,j)/SPD*60+(cur===dep?0:STOP);cur=j;const late=j.win&&t>j.win[1]*60;return {j,t,late}})};
  const before=V.map((_,vi)=>J.filter((_,k)=>k%V.length===vi));
  const ang=j=>Math.atan2(j.y-dep.y,j.x-dep.x);
  const after=V.map(()=>[]);{const s=[...J].sort((a,b)=>ang(a)-ang(b));let vi=0,load=0;const per=Math.ceil(J.length/V.length);
    s.forEach(j=>{if((after[vi].length>=per||load+(+j.size||1)>(V[vi].cap||99))&&vi<V.length-1){vi++;load=0}after[vi].push(j);load+=(+j.size||1)});
    const nn=(r,first=[])=>{const o=[...first];let cur=o.length?o[o.length-1]:dep;const rest=r.filter(j=>!first.includes(j));while(rest.length){rest.sort((a,b)=>dist(cur,a)-dist(cur,b));cur=rest.shift();o.push(cur)}return o};
    // ponytail: 2 candidate orders (nearest-neighbour, time-window first), pick fewer late then shorter; real VRP solver if routes grow
    after.forEach((r,k)=>{const c=[nn(r),nn(r,r.filter(j=>j.win).sort((a,b)=>a.win[1]-b.win[1]))];c.sort((x,y)=>(eta(x).filter(e=>e.late).length-eta(y).filter(e=>e.late).length)||(routeLen(x)-routeLen(y)));after[k]=c[0]})}
  const tot=rs=>rs.reduce((a,r)=>a+routeLen(r),0),late=rs=>rs.reduce((a,r)=>a+eta(r).filter(e=>e.late).length,0);

    const m=(r)=>r.reduce((a,x)=>Math.max(a,eta(x).slice(-1)[0]?.t||ST),ST);
    A.outcome({h:`이동 ${tot(before).toFixed(1)} → ${tot(after).toFixed(1)}km`,s:`약속 시간 초과 ${late(before)}건 → ${late(after)}건`,rows:[['총 이동 거리',tot(before).toFixed(1)+'km',tot(after).toFixed(1)+'km'],['약속 시간 초과',late(before)+'건',late(after)+'건'],['마지막 도착',tm(m(before)),tm(m(after))],...extraK(d)],extra:`<div style="margin-top:16px" class="dgrid"><div>${map(after)}</div><div>${list(after)}</div></div>`});

  $$('input[data-k]',A.body).forEach(i=>i.oninput=()=>F[+i.dataset.k].value=i.value);
  A.foot2('',[{l:`AI ${esc(d.docType||'문서')} 만들기`,pri:1,fn:gen}]);
  let html='';
  async function gen(){A.stage('AI 처리');

     ${Ln.length?`<table class="mt"><thead><tr><th>항목</th><th class="r">수량</th><th class="r">단가</th><th class="r">금액</th></tr></thead><tbody>${Ln.map(x=>`<tr><td>${esc(x.name)}</td><td class="r">${fmt(x.qty)}</td><td class="r">${fmt(x.price)}</td><td class="r">${fmt(x.qty*x.price)}</td></tr>`).join('')}
     <tr><td colspan="3">공급가</td><td class="r">${fmt(sub)}</td></tr><tr><td colspan="3">부가세</td><td class="r">${fmt(Math.round(sub*.1))}</td></tr><tr><td colspan="3"><b>합계</b></td><td class="r"><b>${won(sub+Math.round(sub*.1))}</b></td></tr></tbody></table>`:''}</div>`;
    A.body.innerHTML=`<div style="opacity:0;transition:opacity .6s" id="dv">${html}</div>`;await wait(60);$('#dv',A.body).style.opacity=1;await wait(500);
    A.stage('사람 승인');A.foot2(`받는 분: ${esc(d.to||'고객')}`,[{l:'다시 고치기',fn:()=>{A.stage('입력');SIMS.document(A)}},{l:'확인 · 발송 승인',pri:1,fn:exec}]);

    await A.log([{h:`${esc(d.docType||'문서')} PDF 생성`},{h:`<b>${esc(d.to||'고객')}</b>에게 알림톡 발송`,dt:1},{h:'열람 확인',dt:9},{h:'원본 보관함에 저장'}]);await wait(300);A.stage('결과');
    A.outcome({h:`${esc(d.docType||'문서')} 발송 · 열람 확인`,s:Ln.length?`합계 ${won(sub+Math.round(sub*.1))} (VAT 포함)`:'',rows:extraK(d).length?extraK(d):[['작성 시간','직접 작성','자동 생성 · 확인만']],extra:`<div style="margin-top:16px">${html}</div>`});
  }

/* ---------- SIM: alert ---------- */
SIMS.alert=A=>{
  const d=A.data,R=(d.rules||[]).map(x=>({on:true,...x})),E=d.events||[];
  const hit=(r,e)=>r.on&&e.metric===r.metric&&(r.op==='<'?e.value<r.threshold:e.value>r.threshold);
  const draw=()=>{A.body.innerHTML=`<div class="c-3" style="font-size:13px;margin-bottom:6px">켜고 끄거나 기준을 바꿔 보세요</div>${R.map((r,k)=>`<div class="rule"><button type="button" class="sw" role="switch" aria-checked="${r.on}" aria-label="${esc(r.name)}" data-sw="${k}"></button><div><div class="n">${esc(r.name)}</div><div class="d">${esc(r.metric)} ${r.op==='<'?'아래로':'넘으면'} → ${esc(r.who||BOSS)} · ${esc(r.channel||'알림톡')}</div></div>
    <div class="rg"><input type="range" min="${r.min??0}" max="${r.max??100}" step="${r.step??1}" value="${r.threshold}" data-th="${k}" aria-label="${esc(r.name)} 기준"><output>${r.op==='<'?'<':'>'} ${fmt(r.threshold)}${esc(r.unit||'')}</output></div></div>`).join('')}`;
    $$('[data-sw]',A.body).forEach(b=>b.onclick=()=>{R[+b.dataset.sw].on=!R[+b.dataset.sw].on;draw()});
    $$('[data-th]',A.body).forEach(i=>i.oninput=()=>{const r=R[+i.dataset.th];r.threshold=+i.value;i.nextElementSibling.textContent=`${r.op==='<'?'<':'>'} ${fmt(r.threshold)}${r.unit||''}`})};
  const start=()=>{A.stage('입력');draw();A.foot2(`규칙 ${R.length}개`,[{l:`지난 기록 ${E.length}건으로 돌려보기`,pri:1,fn:replay}])};start();
  async function replay(){A.stage('AI 처리');A.body.innerHTML=`<div id="evs"></div>`;let n=0;
    for(const e of E){const rs=R.filter(r=>hit(r,e));const row=document.createElement('div');row.className='ev'+(rs.length?' hit':'');row.innerHTML=`<span class="c-3 num">${esc(e.t)}</span><span>${esc(e.metric)} ${fmt(e.value)} ${e.note?'· '+esc(e.note):''}</span><span>${rs.length?'알림 → '+rs.map(r=>esc(r.who||BOSS)).join(', '):'<span class="c-3">조용히 기록</span>'}</span>`;$('#evs',A.body).appendChild(row);if(rs.length)n++;await wait(200)}
    const miss=E.filter(e=>e.important&&!R.some(r=>hit(r,e))).length;
    A.body.insertAdjacentHTML('beforeend',`<div class="sumrow">${kpi('알림',n+'건',`${E.length}건 중`)}${kpi('놓친 중요 건',miss+'건','',miss?'bad':'good')}${kpi('조용히 기록',E.length-n+'건','알림 피로 없음')}</div>`);
    A.stage('사람 승인');A.foot2('',[{l:'규칙 다시 조정',fn:start},{l:'이 규칙으로 켜기',pri:1,fn:()=>exec(n,miss)}]);
  }
  async function exec(n,miss){A.stage('실행');A.body.innerHTML='';
    await A.log([...R.filter(r=>r.on).map(r=>({h:`<b>${esc(r.name)}</b> 켜짐 · ${r.op==='<'?'<':'>'} ${fmt(r.threshold)}${esc(r.unit||'')}`,dt:0})),{h:'받는 분께 시험 알림 1건 발송',dt:1}]);await wait(300);A.stage('결과');
    const imp=E.filter(e=>e.important).length;
    A.outcome({h:`중요 ${imp}건 중 ${imp-miss}건을 바로 알림`,s:`알림 ${n}건 · 나머지 ${E.length-n}건은 기록만`,rows:[['놓친 중요 건',`${imp}건 (나중에 발견)`,`${miss}건`],['확인해야 할 알림','전부 직접 확인',`${n}건만`],...extraK(d)]});
  }
};

   <div class="sl"><label for="qB">지점</label><input type="range" id="qB" min="1" max="${Math.max(bb+5,6)}" value="${bb}"><output id="oB"></output></div>
   <div class="qres" aria-live="polite"><div class="r"><span>제작비 (VAT 포함)</span></div><div class="big" id="qT"></div><div class="dl" id="qD"></div><div class="r" style="margin-top:8px"><span>월 고정 비용</span><b id="qM"></b></div></div>
   <p class="c-3" style="font-size:12px;margin:10px 0 0">기능·사용자·지점에 따라 대략 얼마나 달라지는지 보여드리는 계산입니다. 실제 금액은 상담에서 범위를 정한 뒤 정식 견적으로 드립니다.</p>
   <button class="btn" style="width:100%;margin-top:12px" data-go="consult">이 구성으로 상담하기</button></aside></div>`;
  const pU=+S.perUser||3000,pB=+S.perBranch||Math.round((+Q.subtotal||0)*.15/1e4)*1e4,pBM=+S.perBranchMonthly||Math.round((+M.hosting||0)*.6/1e3)*1e3;
  const upd=()=>{const u=+$('#qU',el).value,b=+$('#qB',el).value;$('#oU',el).textContent=u+'명';$('#oB',el).textContent=b+'곳';
    const add=LOCK.filter(f=>state.qsel[f.key]).reduce((a,f)=>a+(+f.estPrice||0),0)+(b-bb)*pB;const sub=(+Q.subtotal||0)+Math.max(-(+Q.subtotal||0),add);const tot=sub+Math.round(sub*.1);
    const mon=(+M.hosting||0)+(+M.maintenance||0)+Math.max(0,u-bu)*pU+(b-bb)*pBM;
    $('#qT',el).textContent=won(tot);$('#qD',el).textContent=tot===+Q.total?`${Q.label||'1차 견적'}과 같음`:`${Q.label||'1차 견적'} 대비 ${tot>Q.total?'+':''}${man(tot-Q.total)}`;$('#qM',el).textContent=won(mon);
    state.qcfg={u,b,tot,mon,feats:LOCK.filter(f=>state.qsel[f.key]).map(f=>f.name)}};
  $$('[data-qf]',el).forEach(c=>c.onchange=()=>{state.qsel[c.dataset.qf]=c.checked;upd()});$('#qU',el).oninput=upd;$('#qB',el).oninput=upd;upd();
}

/* ---------- consult ---------- */
const CHIPS=['기존 엑셀·POS 데이터 옮기기','직원용 모바일 앱','지점 추가','회계·세무 프로그램 연결','지금 홈페이지와 연결','직원 교육 추가'];
function consultView(el){
  const opts=[...LOCK.map(f=>f.name),...CHIPS.filter(c=>!LOCK.some(f=>f.name===c))];
  el.innerHTML=`<div class="cwrap"><div class="fhead"><div class="eyebrow"><span>상담</span></div><h1>더 필요한 기능이 있으신가요?</h1><p class="insight">시안에 없는 기능, 바꾸고 싶은 부분을 편하게 적어 주세요. 상담에서 범위와 비용을 함께 정합니다.</p></div>
   <label for="cTxt" class="c-2" style="font-size:13.5px;font-weight:600">하고 싶은 말씀</label>
   <textarea id="cTxt" placeholder="예) 대타 알림은 오픈조만 쓰고 싶어요. 원가 관리도 같이 보고 싶습니다."></textarea>
   <div class="c-3" style="font-size:13px;margin-top:14px">눌러서 추가</div><div class="chips" role="group" aria-label="추가 기능">${opts.map(o=>`<button type="button" class="chip ${state.consult.has(o)?'on':''}" data-ch="${esc(o)}" aria-pressed="${state.consult.has(o)}">${esc(o)}</button>`).join('')}</div>
   <button class="btn pri lg" id="cGo" type="button">요청 내용 정리하기</button>
   <div class="panel out" id="cOut"><b>정리된 요청</b><pre id="cPre"></pre><button class="btn" id="cCopy" type="button">복사하기</button> <span class="c-3" id="cMsg" style="font-size:13px"></span></div>
   ${(C.toConfirm||[]).length?`<div class="blk"><h2 class="sec">상담에서 함께 확인할 것</h2><div class="panel" style="padding:4px 18px"><ul class="lst">${C.toConfirm.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`:''}
   <div class="final"><span class="k">TALK</span><p>이 내용으로 상담을 원하시면 카카오톡 채널에서 이어서 말씀해 주세요.</p></div></div>`;
  $$('[data-ch]',el).forEach(b=>b.onclick=()=>{const v=b.dataset.ch;state.consult.has(v)?state.consult.delete(v):state.consult.add(v);b.classList.toggle('on');b.setAttribute('aria-pressed',state.consult.has(v))});
  $('#cGo',el).onclick=()=>{const t=$('#cTxt',el).value.trim().slice(0,2000),q=state.qcfg;
    const text=[`[${C.company}] ${PROD} 상담 요청`,state.consult.size?`추가로 원하는 기능: ${[...state.consult].join(', ')}`:'',t?`메모: ${t}`:'',q&&(q.feats.length||q.b>1)?`견적 시뮬레이션: ${[...q.feats,q.b>1?`지점 ${q.b}곳`:'',`사용자 ${q.u}명`].filter(Boolean).join(', ')} · 참고 ${won(q.tot)}`:'',`체험한 기능: ${LIVE.filter(f=>state.done[f.key]).map(f=>f.name).join(', ')||'없음'}`].filter(Boolean).join('\n');
    $('#cPre',el).textContent=text;$('#cOut',el).classList.add('on');$('#cMsg',el).textContent='';
    try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'atz-consult',text},'*')}catch(e){}};
  $('#cCopy',el).onclick=async()=>{const t=$('#cPre',el).textContent;let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e2){}}
    $('#cMsg',el).textContent=ok?'복사했습니다. 카카오톡 채널에 붙여 넣어 주세요.':'위 내용을 길게 눌러 복사해 주세요.'};
}

/* ---------- router ---------- */
const VIEWS={};
function ensure(id){if(VIEWS[id])return VIEWS[id];const s=document.createElement('section');s.className='view';s.id='v-'+id;$('#views').appendChild(s);VIEWS[id]=s;
  if(id[0]==='f')featureView(s,LIVE[+id.slice(1)],+id.slice(1));else if(id[0]==='l')lockView(s,LOCK[+id.slice(1)],+id.slice(1));return s}
function go(id){
  if(!NAV.some(n=>n.id===id))id='home';state.view=id;const el=ensure(id);
  Object.values(VIEWS).forEach(v=>v.classList.toggle('on',v===el));
  if(id==='home')renderHome(el);else if(id==='quote')quoteView(el);else if(id==='consult')consultView(el);
  renderNav();$('#cta').classList.toggle('hide',id==='quote'||id==='consult');window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-addq],[data-ask]');if(!t)return;
  if(t.dataset.go)go(t.dataset.go);
  else if(t.dataset.addq){state.qsel[t.dataset.addq]=true;go('quote');toast('견적 시뮬레이션에 넣었습니다 · 참고용')}
  else if(t.dataset.ask){state.consult.add(t.dataset.ask);go('consult')}});
$('#cta').onclick=()=>go('quote');
$('#ctaT').innerHTML=`${esc(Q.label||'1차 견적')}<b>${won(Q.total)}</b>`;
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
$('#stripR').textContent=`${C.company} 전용 · ATZ MACH 제작 · ${md(exp)}까지 열람`;
document.title=`${C.company} 1차 시안 · ${PROD}`;
go('home');
})();
</script>
</body>
</html>
